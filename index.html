<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALFA OS</title>
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0e111a;color:#e8eaf2;font:16px system-ui,sans-serif}
.b{display:grid;gap:12px;text-align:center}a{display:block;padding:14px 28px;border-radius:18px;background:#2a2f45;color:inherit;text-decoration:none;font-weight:600}</style></head><body>
<div class="b"><div>ALFA OS</div><a href="phone.html">Телефонная версия</a><a href="pc.html">ПК-версия</a></div>
<script>
/* выбираем версию: сначала то, что открывали последним (общий выбор), иначе по устройству. ?choose — показать выбор вручную */
(function(){if(/[?&]choose\b/.test(location.search))return;var m=null;try{m=JSON.parse(localStorage.getItem('alfa.mode'))}catch(e){}
if(m!=='pc'&&m!=='phone'){var wide=matchMedia('(min-width:900px)').matches,touch=matchMedia('(pointer:coarse)').matches;m=wide&&!touch?'pc':'phone'}
location.replace(m+'.html'+location.hash)})();
</script></body></html>
