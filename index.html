<title>ALFA OS</title>

<style>
/* Layout concept: полноэкранная оболочка — обои, рабочий стол, окна приложений, парящая панель из трёх кнопок, шторка сверху.
   Material 3 Expressive: тональные цвета из одного оттенка (--h), фигуры-«печенья», пружинные анимации. */
:root{
  --h:270;
  --display:'Outfit','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --emph:cubic-bezier(.2,0,0,1);
  --primary:oklch(.48 .19 var(--h));
  --on-primary:oklch(.99 .01 var(--h));
  --primary-c:oklch(.89 .075 var(--h));
  --on-primary-c:oklch(.26 .12 var(--h));
  --secondary-c:oklch(.91 .045 calc(var(--h) + 25));
  --on-secondary-c:oklch(.28 .06 calc(var(--h) + 25));
  --tertiary:oklch(.55 .17 calc(var(--h) + 100));
  --tertiary-c:oklch(.9 .085 calc(var(--h) + 100));
  --on-tertiary-c:oklch(.3 .09 calc(var(--h) + 100));
  --surface:oklch(.98 .008 var(--h));
  --surf-1:oklch(.955 .015 var(--h));
  --surf-2:oklch(.93 .024 var(--h));
  --surf-3:oklch(.905 .032 var(--h));
  --on-surface:oklch(.22 .02 var(--h));
  --on-surface-v:oklch(.45 .035 var(--h));
  --outline:oklch(.78 .03 var(--h));
  --error:oklch(.55 .21 25);
  --on-error:oklch(.99 .01 25);
  --shadow:0 8px 28px rgb(20 10 40 / .18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:oklch(.8 .12 var(--h));
  --on-primary:oklch(.28 .1 var(--h));
  --primary-c:oklch(.38 .12 var(--h));
  --on-primary-c:oklch(.92 .05 var(--h));
  --secondary-c:oklch(.34 .06 calc(var(--h) + 25));
  --on-secondary-c:oklch(.91 .04 calc(var(--h) + 25));
  --tertiary:oklch(.8 .12 calc(var(--h) + 100));
  --tertiary-c:oklch(.38 .09 calc(var(--h) + 100));
  --on-tertiary-c:oklch(.92 .06 calc(var(--h) + 100));
  --surface:oklch(.18 .018 var(--h));
  --surf-1:oklch(.22 .022 var(--h));
  --surf-2:oklch(.26 .028 var(--h));
  --surf-3:oklch(.3 .034 var(--h));
  --on-surface:oklch(.93 .015 var(--h));
  --on-surface-v:oklch(.76 .03 var(--h));
  --outline:oklch(.45 .035 var(--h));
  --error:oklch(.75 .15 25);
  --on-error:oklch(.25 .08 25);
  --shadow:0 8px 28px rgb(0 0 0 / .5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:oklch(.8 .12 var(--h));
  --on-primary:oklch(.28 .1 var(--h));
  --primary-c:oklch(.38 .12 var(--h));
  --on-primary-c:oklch(.92 .05 var(--h));
  --secondary-c:oklch(.34 .06 calc(var(--h) + 25));
  --on-secondary-c:oklch(.91 .04 calc(var(--h) + 25));
  --tertiary:oklch(.8 .12 calc(var(--h) + 100));
  --tertiary-c:oklch(.38 .09 calc(var(--h) + 100));
  --on-tertiary-c:oklch(.92 .06 calc(var(--h) + 100));
  --surface:oklch(.18 .018 var(--h));
  --surf-1:oklch(.22 .022 var(--h));
  --surf-2:oklch(.26 .028 var(--h));
  --surf-3:oklch(.3 .034 var(--h));
  --on-surface:oklch(.93 .015 var(--h));
  --on-surface-v:oklch(.76 .03 var(--h));
  --outline:oklch(.45 .035 var(--h));
  --error:oklch(.75 .15 25);
  --on-error:oklch(.25 .08 25);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--surface);color:var(--on-surface);font:400 15px/1.4 var(--body);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;width:1em;overflow:hidden;flex:none;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

#os{position:relative;height:100%;overflow:hidden;background:var(--surface)}
#os>*{position:absolute}
#dim{inset:0;background:#000;opacity:0;pointer-events:none;z-index:30}

/* ---------- обои ---------- */
.wall{inset:0;overflow:hidden;background:var(--surface)}
.wall i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.95;will-change:transform}
.wall .b1{width:72vmax;height:72vmax;left:-24vmax;top:-28vmax;background:var(--primary-c);animation:drift 28s ease-in-out infinite alternate}
.wall .b2{width:64vmax;height:64vmax;right:-24vmax;bottom:-28vmax;background:var(--tertiary-c);animation:drift 34s ease-in-out infinite alternate-reverse}
.wall .b3{width:42vmax;height:42vmax;left:34%;top:38%;background:var(--secondary-c);animation:drift 22s ease-in-out infinite alternate}
.wall.w1 i{filter:none;border-radius:34%;opacity:.8}
.wall.w1 .b1{animation:spin 60s linear infinite}
.wall.w1 .b2{animation:spin 80s linear infinite reverse}
.wall.w1 .b3{border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.wall.w2{background:linear-gradient(165deg,var(--primary-c),var(--surface) 55%,var(--tertiary-c))}
.wall.w2 i{display:none}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- рабочий стол ---------- */
#home{inset:0;display:flex;flex-direction:column;gap:18px;padding:56px max(20px,env(safe-area-inset-left)) 92px;width:100%;max-width:1060px;left:50%;transform:translateX(-50%);z-index:1}
.hw{display:flex;flex-direction:column;gap:2px;padding-left:6px}
#hclock{font:500 clamp(64px,13vw,112px)/.95 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#hdate{font:500 17px/1.3 var(--display);color:var(--on-surface-v)}
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-radius:28px;background:var(--surf-2);color:var(--on-surface-v);transition:background .2s,border-radius .4s var(--spring)}
.search:focus-within{background:var(--surf-3);border-radius:20px}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;font-size:16px;color:var(--on-surface)}
.search input::placeholder{color:var(--on-surface-v)}
#grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));align-content:start;gap:18px 8px;padding:6px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;border:0;background:transparent;border-radius:20px}
.tile span.n{font-size:13px;font-weight:500;text-align:center}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 16px;color:var(--on-surface-v);text-align:center}
.empty .ms{font-size:40px}
#dock{display:flex;justify-content:center;gap:10px;align-self:center;padding:10px 14px;border-radius:36px;background:var(--surf-2);box-shadow:0 2px 10px rgb(0 0 0 / .08)}
#dock .tile{padding:2px}

/* иконки-фигуры */
.tone-p{--ib:var(--primary-c);--if:var(--on-primary-c)}
.tone-s{--ib:var(--secondary-c);--if:var(--on-secondary-c)}
.tone-t{--ib:var(--tertiary-c);--if:var(--on-tertiary-c)}
.ai{position:relative;display:grid;place-items:center;width:64px;height:64px;color:var(--if);flex:none}
.ai svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .55s var(--spring)}
.ai svg path{fill:var(--ib)}
.ai .ms{position:relative;font-size:30px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.ai.sm{width:38px;height:38px}.ai.sm .ms{font-size:20px}
.ai.xl{width:104px;height:104px}.ai.xl .ms{font-size:48px}
.tile:hover .ai svg,.tile:focus-visible .ai svg{transform:rotate(36deg) scale(1.06)}
.tile:active .ai svg{transform:scale(.86)}

/* ---------- окна ---------- */
#wins{inset:0;z-index:2;pointer-events:none}
.win{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;transform-origin:0 0}
.win.min{display:none}
.wbar{display:flex;align-items:center;gap:12px;padding:44px max(18px,env(safe-area-inset-left)) 10px;min-height:92px;flex:none}
.wbar h2{flex:1;min-width:0;font:600 28px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wctl{display:none;gap:6px}
.wb{width:34px;height:34px;border-radius:50%;border:0;background:var(--surf-2);display:grid;place-items:center;transition:border-radius .3s var(--spring),background .2s}
.wb .ms{font-size:18px}
.wb:hover{border-radius:12px;background:var(--surf-3)}
.wb.x:hover{background:var(--error);color:var(--on-error)}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding-bottom:84px}
.desk .wbody{padding-bottom:0}
.desk .win{inset:auto;left:var(--x);top:var(--y);width:var(--w);height:var(--hh);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--outline);resize:both;min-width:360px;min-height:300px}
.desk .win.max{left:10px!important;top:44px!important;width:calc(100% - 20px)!important;height:calc(100% - 44px - 84px)!important;resize:none}
.desk .wbar{padding:8px 12px 8px 16px;min-height:54px;cursor:grab;touch-action:none}
.desk .wbar h2{font-size:17px}
.desk .wctl{display:flex}

/* ---------- общие элементы ---------- */
.page{flex:1;min-height:0;overflow:auto;padding:4px max(16px,env(safe-area-inset-left)) 20px;display:flex;flex-direction:column;gap:12px}
.group{display:flex;flex-direction:column;gap:3px;border-radius:28px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border:0;background:var(--surf-1);text-align:left;min-height:64px;transition:background .2s}
.li:hover{background:var(--surf-2)}
.li .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.li small{color:var(--on-surface-v);font-size:13px}
.li>.ms:first-child{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);font-weight:600;transition:border-radius .35s var(--spring),transform .2s,filter .2s}
.btn:hover{border-radius:16px;filter:brightness(1.06)}
.btn:active{transform:scale(.95)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf-2);display:grid;place-items:center;transition:border-radius .3s var(--spring),background .2s}
.iconbtn:hover{border-radius:14px;background:var(--surf-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surf-2);border-radius:28px;align-self:center}
.seg button{border:0;background:transparent;border-radius:24px;padding:10px 18px;font-weight:600;color:var(--on-surface-v);transition:background .25s,border-radius .3s var(--spring)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.chip{border:1px solid var(--outline);background:transparent;border-radius:12px;padding:8px 14px;font-weight:500;transition:background .2s}
.chip[aria-pressed=true]{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent}
.fab{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--navpad,100px) + 4px);display:flex;align-items:center;gap:10px;height:64px;padding:0 24px;border:0;border-radius:22px;background:var(--tertiary-c);color:var(--on-tertiary-c);font-weight:700;box-shadow:var(--shadow);transition:border-radius .4s var(--spring),transform .2s}
.fab:hover{border-radius:32px}.fab:active{transform:scale(.94)}
.desk .fab{bottom:20px}
.card{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:0;border-radius:24px;background:var(--surf-1);text-align:left;transition:background .2s,border-radius .35s var(--spring)}
.card:hover{background:var(--surf-2);border-radius:30px}
.card small{color:var(--on-surface-v)}
.card span{color:var(--on-surface-v)}
.sw{width:56px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surf-3);position:relative;padding:0;flex:none;transition:background .25s,border-color .25s}
.sw i{position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:left .35s var(--spring),width .2s,height .2s,background .2s}
.sw:active i{width:22px;height:22px}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true] i{left:28px;width:24px;height:24px;background:var(--on-primary)}
.sw[aria-checked=true]:active i{left:24px;width:28px;height:28px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:18px;border-radius:9px;background:linear-gradient(90deg,var(--primary) var(--p),var(--surf-3) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:44px;border-radius:3px;background:var(--primary);margin-top:-13px;box-shadow:0 0 0 4px var(--surface)}
input[type=range]::-moz-range-track{height:18px;border-radius:9px;background:var(--surf-3)}
input[type=range]::-moz-range-progress{height:18px;border-radius:9px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:6px;height:44px;border:0;border-radius:3px;background:var(--primary);box-shadow:0 0 0 4px var(--surface)}
.sl{display:flex;align-items:center;gap:14px}
.sl>.ms{color:var(--on-surface-v)}
.hero{display:flex;align-items:center;gap:18px;padding:18px;border-radius:28px;background:var(--primary-c);color:var(--on-primary-c)}
.hero svg{width:72px;height:72px;flex:none}
.hero b{font:600 24px var(--display);display:block}
.sub{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-v);padding:10px 6px 0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:6px}
.swatch{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;transition:border-radius .4s var(--spring),transform .2s}
.swatch[aria-pressed=true]{border-radius:30%}
.swatch:hover{transform:scale(1.08)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp{height:112px;border-radius:22px;border:3px solid transparent;overflow:hidden;position:relative;padding:0;background:var(--surface);transition:border-radius .4s var(--spring)}
.wp[aria-pressed=true]{border-color:var(--primary);border-radius:32px}
.wp i{position:absolute;border-radius:50%;filter:blur(14px)}
.wp .a{width:70%;height:70%;left:-10%;top:-10%;background:var(--primary-c)}
.wp .b{width:70%;height:70%;right:-10%;bottom:-10%;background:var(--tertiary-c)}
.wp.p1 i{filter:none;border-radius:34%;transform:rotate(20deg)}
.wp.p2{background:linear-gradient(165deg,var(--primary-c),var(--surface) 55%,var(--tertiary-c))}
.wp.p2 i{display:none}
.wp span{position:absolute;left:0;right:0;bottom:6px;font-size:12px;font-weight:600;text-align:center}

/* ---------- калькулятор ---------- */
.calc{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-left)) 14px;gap:12px}
.cdisp{flex:1;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 12px;overflow:hidden}
.cs{color:var(--on-surface-v);min-height:22px;font-size:16px}
.cd{font:500 64px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{height:clamp(52px,9vh,72px);border:0;border-radius:50%;background:var(--surf-2);font:500 26px var(--display);transition:border-radius .35s var(--spring),transform .15s,background .2s}
.ck:hover{border-radius:26px}
.ck:active{transform:scale(.93)}
.ck.o{background:var(--secondary-c);color:var(--on-secondary-c)}
.ck.f{background:var(--surf-3)}
.ck.e{background:var(--primary);color:var(--on-primary)}

/* ---------- часы ---------- */
.ctab{padding:0 16px 10px;display:flex;justify-content:center}
.clk{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 16px 20px}
.clk svg{width:min(70vw,280px);height:auto;max-height:42vh}
.big{font:500 clamp(48px,14vw,76px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.laps{width:min(100%,360px);display:flex;flex-direction:column;gap:2px;max-height:160px;overflow:auto}
.laps div{display:flex;justify-content:space-between;padding:8px 16px;background:var(--surf-1);font-variant-numeric:tabular-nums}

/* ---------- календарь ---------- */
.cal{flex:1;min-height:0;overflow:auto;padding:0 max(16px,env(safe-area-inset-left)) 20px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:8px}
.chead h3{flex:1;font:600 24px var(--display);text-transform:capitalize}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cgrid .wd{font-size:12px;font-weight:600;color:var(--on-surface-v);padding:6px 0}
.cgrid button{aspect-ratio:1;max-height:56px;border:0;border-radius:50%;background:transparent;font-weight:500;font-variant-numeric:tabular-nums;transition:border-radius .35s var(--spring),background .2s}
.cgrid button:hover{background:var(--surf-2);border-radius:30%}
.cgrid button.today{background:var(--primary);color:var(--on-primary)}
.cgrid button.sel:not(.today){background:var(--primary-c);color:var(--on-primary-c);border-radius:30%}

/* ---------- игра, пианино, рисование ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px 16px}
.score{display:flex;gap:12px}
.score div{padding:8px 18px;border-radius:20px;background:var(--surf-2);display:flex;gap:8px;align-items:baseline}
.score b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.stage{position:relative;flex:1;min-height:0;width:100%;display:grid;place-items:center}
.scv{width:min(100%,100cqh,520px);aspect-ratio:1;border-radius:28px;display:block;background:var(--surf-1);touch-action:none;max-height:100%}
.stage{container-type:size}
.sov{position:absolute;inset:0;margin:auto;width:min(100%,100cqh,520px);aspect-ratio:1;border-radius:28px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.sov h3{font:600 28px var(--display)}
.piano{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 max(16px,env(safe-area-inset-left)) 16px}
.keys{position:relative;flex:1;min-height:180px;display:flex;gap:3px;touch-action:none}
.wk{flex:1;border:1px solid var(--outline);border-radius:0 0 18px 18px;background:var(--surface);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;color:var(--on-surface-v);transition:background .1s;touch-action:none}
.wk.on{background:var(--primary-c)}
.bk{position:absolute;top:0;height:60%;width:6%;border:0;border-radius:0 0 12px 12px;background:var(--on-surface);z-index:2;touch-action:none;transition:background .1s}
.bk.on{background:var(--primary)}
.dtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-left)) 12px}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;transition:border-radius .35s var(--spring),transform .2s}
.dot[aria-pressed=true]{border-color:var(--on-surface);border-radius:30%}
.dtools input[type=range]{width:130px}
.dwrap{position:relative;flex:1;min-height:0;margin:0 max(16px,env(safe-area-inset-left)) 16px;border-radius:24px;overflow:hidden;background:#fbfbf8}
.dwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---------- заметки ---------- */
.note{gap:6px}
.note b{font:600 18px var(--display)}
.ni{height:56px;border:0;border-radius:18px;background:var(--surf-1);padding:0 18px;font:600 20px var(--display);outline:0}
.nt{flex:1;min-height:140px;border:0;border-radius:22px;background:var(--surf-1);padding:16px 18px;resize:none;outline:0;line-height:1.5}
.ni:focus,.nt:focus{background:var(--surf-2)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.frow .ai{width:44px;height:44px}.frow .ai .ms{font-size:22px}
.info{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:24px;background:var(--tertiary-c);color:var(--on-tertiary-c)}

/* ---------- верхняя панель ---------- */
#status{left:0;right:0;top:0;height:40px;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,env(safe-area-inset-left));font:600 14px var(--display);cursor:pointer;background:transparent;border:0}
#status>*{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#status .ms{font-size:18px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20}
#status .dotn{width:8px;height:8px;border-radius:50%;background:var(--primary)}

/* ---------- шторка ---------- */
#shade{inset:0;z-index:6}
#shade .scrim{position:absolute;inset:0;background:rgb(0 0 0 / .38)}
#shade .panel{position:absolute;top:0;right:0;width:min(100%,440px);max-height:100%;overflow:auto;padding:52px 16px 18px;background:var(--surface);border-radius:0 0 36px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.sh-time{font:600 34px var(--display);letter-spacing:-.02em}
.sh-date{color:var(--on-surface-v)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.qt{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-size:12px;font-weight:500;color:var(--on-surface-v)}
.qt span.sh{width:100%;max-width:78px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--surf-3);color:var(--on-surface);transition:border-radius .45s var(--spring),background .25s,transform .15s}
.qt:active span.sh{transform:scale(.9)}
.qt[aria-pressed=true] span.sh{background:var(--primary);color:var(--on-primary);border-radius:30%}
.nh{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.nh h3{font:600 16px var(--display)}
.nitem{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:24px;background:var(--surf-1);border:0;width:100%;text-align:left}
.nitem .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.nitem small{color:var(--on-surface-v)}
.nitem .iconbtn{width:36px;height:36px;background:transparent}

/* ---------- недавние ---------- */
#recents{inset:0;z-index:4;background:color-mix(in oklab,var(--surface) 90%,transparent);backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:center;padding:60px 0 100px}
.rrow{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px max(24px,calc(50% - 140px));align-items:center}
.rcard{flex:none;width:min(280px,72vw);height:min(52vh,400px);scroll-snap-align:center;border-radius:32px;background:var(--surf-2);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-x;cursor:pointer;transition:transform .35s var(--spring),opacity .3s;box-shadow:0 4px 16px rgb(0 0 0 / .12)}
.rcard:hover{transform:translateY(-6px)}
.rh{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 14px}
.rh b{flex:1;font:600 15px var(--display)}
.rp{flex:1;margin:0 10px 10px;border-radius:24px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:12px;color:var(--on-surface-v);font-size:13px}
.rclear{align-self:center;margin-top:8px}
.rempty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--on-surface-v)}
.rempty .ms{font-size:48px}

/* ---------- панель навигации ---------- */
#nav{left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;gap:6px;padding:6px;background:var(--surf-3);border-radius:34px;box-shadow:var(--shadow)}
#nav button{width:84px;height:52px;border-radius:26px;border:0;background:transparent;color:var(--on-surface);display:grid;place-items:center;transition:background .2s,border-radius .4s var(--spring),transform .2s}
#nav button:hover{background:color-mix(in oklab,var(--on-surface) 10%,transparent)}
#nav button:active{background:var(--primary-c);border-radius:18px;transform:scale(.93)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}

/* ---------- блокировка и загрузка ---------- */
#lock{inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;padding:84px max(28px,env(safe-area-inset-left)) 40px;touch-action:none;cursor:pointer}
#lock .bg{position:absolute;inset:0;z-index:-1}
#lclock{font:600 clamp(88px,22vw,190px)/.9 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
#ldate{font:500 22px var(--display);color:var(--on-surface-v);margin-top:10px}
.lhint{align-self:center;display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:26px;background:var(--surf-3);font-weight:600;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.lnote{margin-top:22px;display:flex;flex-direction:column;gap:8px;max-width:420px}
#boot{inset:0;z-index:12;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s var(--emph),transform .6s var(--emph)}
#boot.out{opacity:0;transform:scale(1.08);pointer-events:none}
#boot svg{width:min(44vw,180px);height:auto;overflow:visible}
.bname{font:600 40px var(--display);letter-spacing:.12em;display:flex;align-items:center;gap:14px}
.bver{font:600 13px var(--display);letter-spacing:.06em;padding:5px 12px;border-radius:12px;background:var(--tertiary-c);color:var(--on-tertiary-c)}
.bbar{width:min(60vw,240px);height:8px;border-radius:4px;background:var(--surf-3);overflow:hidden}
.bbar i{display:block;height:100%;background:var(--primary);border-radius:4px;transform-origin:left;transform:scaleX(0)}

#toast{left:50%;bottom:90px;transform:translateX(-50%);z-index:11;max-width:min(90%,420px);padding:12px 20px;border-radius:22px;background:var(--on-surface);color:var(--surface);font-weight:500;pointer-events:none;opacity:0;display:flex;align-items:center;gap:10px}

@media (max-width:899px){#grid{grid-template-columns:repeat(4,1fr)}.tile .ai{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);for(const k in props||{}){const v=props[k];if(k==='class')el.className=v;else if(k==='style')el.style.cssText=v;else if(k==='value')el.value=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(2)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
const ic=(n,c='')=>h('span',{class:('ms '+c).trim(),'aria-hidden':'true'},n);
const store={get(k,d){try{const v=localStorage.getItem('alfa.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('alfa.'+k,JSON.stringify(v))}catch(e){}}};
const rand=n=>Math.floor(Math.random()*n);
const pad=n=>String(n).padStart(2,'0');
const root=document.documentElement;
const os=$('#os');

/* ---------- состояние ---------- */
const S={hue:store.get('hue',270),dark:store.get('dark',null),wall:store.get('wall',0),vol:store.get('vol',.6),bright:store.get('bright',1),
  wifi:true,bt:true,air:false,flash:false,dnd:false,saver:false,mute:false};
const isDark=()=>{const t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(){root.style.setProperty('--h',S.hue);if(S.dark!==null)root.setAttribute('data-theme',S.dark?'dark':'light');
  [$('#wall'),$('#lwall')].forEach(w=>{w.className='wall w'+S.wall+(w.id==='lwall'?' bg':'')});
  $('#dim').style.opacity=(1-S.bright)*.75}
function setDark(v){S.dark=v;store.set('dark',v);applyTheme()}
let desk=false,locked=true,booting=true,shadeOpen=false;
const toastEl=$('#toast');let toastT;
function toast(msg,icon){toastEl.replaceChildren(icon?ic(icon):'',msg);toastEl.animate([{opacity:0,transform:'translateX(-50%) translateY(16px) scale(.9)'},{opacity:1,transform:'translateX(-50%)'}],{duration:350,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards'});clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'})},2400)}

/* ---------- звук ---------- */
let AC,master;
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.connect(AC.destination)}master.gain.value=S.mute?0:S.vol*.5;if(AC.state==='suspended')AC.resume();return AC}
function tone(freq,type){const c=audio();if(!c)return null;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;const t=c.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.6,t+.015);g.gain.exponentialRampToValueAtTime(.2,t+.5);o.connect(g);g.connect(master);o.start();
  return{stop(){const n=c.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n);g.gain.exponentialRampToValueAtTime(.0001,n+.25);o.stop(n+.3)}}}
function beep(n){let i=0;const go=()=>{const t=tone(880,'sine');setTimeout(()=>t&&t.stop(),160);if(++i<(n||3))setTimeout(go,300)};go()}

/* ---------- фигуры ---------- */
function scallop(n,amp,rot,R){R=R||44;let d='';const N=120;for(let i=0;i<=N;i++){const a=i/N*Math.PI*2,r=R*(1+amp*Math.cos(n*a+rot));d+=(i?'L':'M')+(50+Math.cos(a)*r).toFixed(2)+' '+(50+Math.sin(a)*r).toFixed(2)}return d+'Z'}
const SHAPES=[scallop(8,.07,0),scallop(4,.12,.8),scallop(12,.045,0),scallop(6,.09,.5)];

/* ---------- приложения ---------- */
const APPS={};
function def(id,name,icon,tone,shape,size,create){APPS[id]={id,name,icon,tone,shape,size,create}}
function aiIcon(id,cls){const d=APPS[id];const s=h('span',{class:('ai tone-'+d.tone+' '+(cls||'')).trim()});s.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="'+SHAPES[d.shape]+'"/></svg>';s.append(ic(d.icon));return s}
const fmtDate=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

/* Калькулятор */
function calcApp(a){
  let cur='0',acc=null,op=null,fresh=true;
  const disp=h('div',{class:'cd'},'0'),sub=h('div',{class:'cs'});
  const rnd=v=>{if(!isFinite(v))return'Ошибка';return String(parseFloat(v.toPrecision(12)))};
  const fmtN=s=>{if(s==='Ошибка')return s;const [i,f]=s.split('.');const neg=i.startsWith('-');const body=(neg?i.slice(1):i).replace(/\B(?=(\d{3})+(?!\d))/g,' ');return(neg?'-':'')+body+(f!==undefined?','+f:'')};
  const calc=(x,o,y)=>o==='+'?x+y:o==='−'?x-y:o==='×'?x*y:y===0?Infinity:x/y;
  function show(){disp.textContent=fmtN(cur);disp.style.fontSize=cur.length>12?'34px':cur.length>8?'46px':'64px'}
  function digit(d){if(cur==='Ошибка')fresh=true;if(fresh){cur=d==='.'?'0.':d;fresh=false}else{if(d==='.'&&cur.includes('.'))return;cur=cur==='0'&&d!=='.'?d:cur+d}show()}
  function oper(o){if(cur==='Ошибка')return;if(op&&!fresh){acc=calc(acc,op,+cur);cur=rnd(acc);acc=+cur}else if(!op)acc=+cur;op=o;fresh=true;sub.textContent=fmtN(rnd(acc))+' '+o;show()}
  function eq(){if(!op||cur==='Ошибка')return;const x=acc,y=+cur,r=calc(x,op,y);sub.textContent=fmtN(rnd(x))+' '+op+' '+fmtN(rnd(y))+' =';cur=rnd(r);op=null;acc=null;fresh=true;show()}
  function press(k){
    if(/^[0-9.]$/.test(k))digit(k);
    else if('+−×÷'.includes(k))oper(k);
    else if(k==='=')eq();
    else if(k==='C'){cur='0';acc=null;op=null;fresh=true;sub.textContent='';show()}
    else if(k==='±'){if(cur!=='0'&&cur!=='Ошибка'){cur=cur.startsWith('-')?cur.slice(1):'-'+cur;show()}}
    else if(k==='%'){if(cur!=='Ошибка'){cur=rnd(+cur/100);show()}}
    else if(k==='⌫'){if(!fresh&&cur!=='Ошибка'){cur=cur.length>1&&cur!=='-0'?cur.slice(0,-1):'0';if(cur==='-')cur='0';show()}}}
  const rows=[['C','±','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['0','.','⌫','=']];
  const keys=h('div',{class:'ckeys'},rows.flat().map(k=>h('button',{class:'ck'+('÷×−+'.includes(k)?' o':k==='='?' e':'C±%⌫'.includes(k)?' f':''),'aria-label':k,onclick:()=>press(k)},k)));
  a.el.append(h('div',{class:'calc'},h('div',{class:'cdisp'},sub,disp),keys));
  return{key(e){const m={'*':'×','/':'÷','-':'−',Enter:'=',Backspace:'⌫',Delete:'C',c:'C',C:'C',',':'.'};const k=m[e.key]||e.key;if(/^[0-9.+=]$/.test(k)||'×÷−⌫C'.includes(k)){press(k);return true}return false}}
}

/* Часы */
function clockApp(a){
  let tab='clock';
  const sw={run:false,t0:0,acc:0,laps:[]};
  const tm={set:300,left:300,run:false,end:0};
  const mmss=ms=>{const t=Math.max(0,ms);return pad(Math.floor(t/60000))+':'+pad(Math.floor(t/1000)%60)};
  const swFmt=ms=>mmss(ms)+','+pad(Math.floor(ms/10)%100);
  const holder=h('div',{style:'flex:1;min-height:0;display:flex;flex-direction:column'});
  const segs=[['clock','Часы'],['sw','Секундомер'],['tm','Таймер']];
  const bar=h('div',{class:'ctab'},h('div',{class:'seg'},segs.map(([k,n])=>h('button',{'aria-pressed':k===tab,onclick:()=>{tab=k;render()}},n))));
  a.el.append(bar,holder);
  let upd=()=>{};
  function render(){
    [...bar.firstChild.children].forEach((b,i)=>b.setAttribute('aria-pressed',segs[i][0]===tab));
    if(tab==='clock'){
      const ticks=Array.from({length:60},(_,i)=>{const big=i%5===0,ang=i*6*Math.PI/180,r1=big?84:90,r2=96;return`<line x1="${100+Math.sin(ang)*r1}" y1="${100-Math.cos(ang)*r1}" x2="${100+Math.sin(ang)*r2}" y2="${100-Math.cos(ang)*r2}" stroke="var(--on-surface-v)" stroke-width="${big?3:1.2}" stroke-linecap="round"/>`}).join('');
      const wrap=h('div',{class:'clk'});
      wrap.innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="Аналоговые часы"><path d="${scallop(12,.03,0,92)}" fill="var(--primary-c)"/>${ticks}<line id="ah" x1="100" y1="100" x2="100" y2="58" stroke="var(--on-primary-c)" stroke-width="7" stroke-linecap="round"/><line id="am" x1="100" y1="100" x2="100" y2="36" stroke="var(--on-primary-c)" stroke-width="5" stroke-linecap="round"/><line id="as" x1="100" y1="112" x2="100" y2="28" stroke="var(--tertiary)" stroke-width="2.5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--tertiary)"/></svg><div class="big" id="dg"></div><div id="dd" style="color:var(--on-surface-v);text-transform:capitalize"></div>`;
      holder.replaceChildren(wrap);
      upd=()=>{const d=new Date,s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,hr=d.getHours()%12+m/60;
        const set=(id,deg)=>wrap.querySelector(id).setAttribute('transform','rotate('+deg+' 100 100)');set('#ah',hr*30);set('#am',m*6);set('#as',s*6);
        wrap.querySelector('#dg').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());wrap.querySelector('#dd').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})};
    }else if(tab==='sw'){
      const disp=h('div',{class:'big'},swFmt(sw.acc)),laps=h('div',{class:'laps'});
      const go=h('button',{class:'btn',onclick:()=>{if(sw.run){sw.acc+=performance.now()-sw.t0;sw.run=false}else{sw.t0=performance.now();sw.run=true}render()}},ic(sw.run?'pause':'play_arrow'),sw.run?'Пауза':'Старт');
      const lap=h('button',{class:'btn tonal',onclick:()=>{if(sw.run){const t=sw.acc+performance.now()-sw.t0;sw.laps.unshift(t);render()}else{sw.acc=0;sw.laps=[];render()}}},ic(sw.run?'flag':'restart_alt'),sw.run?'Круг':'Сброс');
      sw.laps.forEach((t,i)=>laps.append(h('div',{},h('span',{},'Круг '+(sw.laps.length-i)),h('b',{},swFmt(t)))));
      holder.replaceChildren(h('div',{class:'clk'},disp,h('div',{class:'row'},lap,go),laps));
      upd=()=>{disp.textContent=swFmt(sw.run?sw.acc+performance.now()-sw.t0:sw.acc)};

function snakeApp(a){
  const G=20,C=20;const cv=h('canvas',{width:G*C,height:G*C,class:'scv'});const ctx=cv.getContext('2d');
  const probe=h('i',{style:'display:none'});a.el.append(probe);
  const col=n=>{probe.style.color='var('+n+')';return getComputedStyle(probe).color};
  let sn,dir,nd,food,score=0,best=store.get('snake',0),state='idle';
  const sc=h('b',{},'0'),bs=h('b',{},String(best));
  const ovT=h('h3',{},'Змейка'),ovS=h('div',{style:'color:var(--on-surface-v)'},'Стрелки, WASD или свайп');
  const ov=h('div',{class:'sov'},ovT,ovS,h('button',{class:'btn',onclick:start},ic('play_arrow'),'Играть'));
  a.el.append(h('div',{class:'game'},h('div',{class:'score'},h('div',{},'Счёт',sc),h('div',{},'Рекорд',bs)),h('div',{class:'stage'},cv,ov)));
  function place(){do{food={x:rand(G),y:rand(G)}}while(sn.some(s=>s.x===food.x&&s.y===food.y))}
  function start(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};score=0;sc.textContent='0';place();state='run';ov.hidden=true;draw()}
  function over(){state='over';if(score>best){best=score;store.set('snake',best);bs.textContent=best}ovT.textContent='Игра окончена';ovS.textContent='Счёт: '+score;ov.hidden=false}
  function step(){if(state!=='run'||!a.active())return;dir=nd;const hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(hd.x<0||hd.y<0||hd.x>=G||hd.y>=G||sn.some(s=>s.x===hd.x&&s.y===hd.y)){over();return}
    sn.unshift(hd);if(hd.x===food.x&&hd.y===food.y){score++;sc.textContent=score;place()}else sn.pop();draw()}
  function draw(){ctx.fillStyle=col('--surf-1');ctx.fillRect(0,0,G*C,G*C);
    ctx.fillStyle=col('--surf-3');for(let x=0;x<G;x++)for(let y=0;y<G;y++)if((x+y)%2===0)ctx.fillRect(x*C,y*C,C,C);
    if(!sn)return;ctx.fillStyle=col('--tertiary');ctx.beginPath();ctx.arc(food.x*C+C/2,food.y*C+C/2,C*.38,0,7);ctx.fill();
    sn.forEach((s,i)=>{ctx.fillStyle=i?col('--primary'):col('--on-surface');ctx.beginPath();ctx.roundRect(s.x*C+1,s.y*C+1,C-2,C-2,i?6:9);ctx.fill()})}
  function turn(x,y){if(x===-dir.x&&y===-dir.y)return;nd={x,y}}
  let sx,sy;cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  cv.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)<12&&Math.abs(dy)<12)return;if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)});
  a.every(step,115);draw();
  return{key(e){const k=e.key.toLowerCase(),M={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
    if(M[k]){if(state!=='run')return false;turn(...M[k]);return true}
    if(k===' '||k==='enter'){if(state!=='run'){start();return true}}return false}}
}

function focusTask(t){const i=tasks.indexOf(t);if(i>=0)tasks.splice(i,1);tasks.push(t);t.win.style.zIndex=++zc;
  if(!desk)tasks.forEach(o=>{if(o!==t)o.win.classList.add('min')})}
function minimize(t,anim){if(t.win.classList.contains('min'))return;
  if(anim===false){t.win.classList.add('min');return}
  const an=t.win.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.86) translateY(30px)'}],{duration:220,easing:'cubic-bezier(.3,0,.8,.15)'});an.onfinish=()=>t.win.classList.add('min')}
function closeTask(t){const i=tasks.indexOf(t);if(i<0)return;tasks.splice(i,1);t.cleanups.forEach(f=>{try{f()}catch(e){}});
  const an=t.win.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.88)'}],{duration:200,easing:'ease-in'});an.onfinish=()=>t.win.remove();
  if(!$('#recents').hidden)renderRecents()}
function toggleMax(t){t.win.classList.toggle('max');t.win.animate([{transform:'scale(.97)'},{transform:'none'}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'})}
function openApp(id,from){
  closeOverlays();let t=tasks.find(x=>x.id===id);
  if(t){const wasMin=t.win.classList.contains('min');t.win.classList.remove('min');focusTask(t);if(wasMin)launchAnim(t.win,from);return t}
  const d=APPS[id];const win=h('section',{class:'win',role:'dialog','aria-label':d.name});
  const title=h('h2',{},d.name);t={id,def:d,win,title,cleanups:[],inst:{}};
  const ctl=h('div',{class:'wctl'},
    h('button',{class:'wb',title:'Свернуть','aria-label':'Свернуть',onclick:e=>{e.stopPropagation();minimize(t)}},ic('remove')),
    h('button',{class:'wb',title:'Развернуть','aria-label':'Развернуть',onclick:()=>toggleMax(t)},ic('open_in_full')),
    h('button',{class:'wb x',title:'Закрыть','aria-label':'Закрыть',onclick:()=>closeTask(t)},ic('close')));
  const bar=h('header',{class:'wbar'},aiIcon(id,'sm'),title,ctl);
  const body=h('div',{class:'wbody'});win.append(bar,body);t.body=body;
  if(desk){const W=wins.clientWidth,H=wins.clientHeight,[sw,sh]=d.size,w=Math.min(sw,W-24),hh=Math.min(sh,H-44-92),n=tasks.length%6;
    win.style.setProperty('--w',w+'px');win.style.setProperty('--hh',hh+'px');
    win.style.setProperty('--x',Math.max(8,(W-w)/2+(n-2)*30)+'px');win.style.setProperty('--y',Math.max(44,Math.min(44+n*26,H-hh-92))+'px')}
  bar.addEventListener('pointerdown',e=>{if(!desk||e.target.closest('.wctl')||win.classList.contains('max'))return;
    const r=win.getBoundingClientRect(),wr=wins.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;bar.setPointerCapture(e.pointerId);bar.style.cursor='grabbing';
    const mv=ev=>{win.style.setProperty('--x',Math.max(-r.width+80,Math.min(wr.width-80,ev.clientX-wr.left-ox))+'px');win.style.setProperty('--y',Math.max(40,Math.min(wr.height-90,ev.clientY-wr.top-oy))+'px')};
    const up=()=>{bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.style.cursor=''};bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up)});
  win.addEventListener('pointerdown',()=>{if(desk&&fg()!==t)focusTask(t)},true);
  wins.append(win);focusTask(t);
  const api={el:body,setTitle:s=>{title.textContent=s},toast,close:()=>closeTask(t),on:f=>t.cleanups.push(f),every:(f,ms)=>{const i=setInterval(f,ms);t.cleanups.push(()=>clearInterval(i))},
    visible:()=>!win.classList.contains('min'),active:()=>fg()===t&&!document.hidden};
  t.inst=d.create(api)||{};launchAnim(win,from);return t}

/* ---------- рабочий стол ---------- */
const q=$('#q'),grid=$('#grid'),dock=$('#dock');
function tile(id){const b=h('button',{class:'tile','aria-label':APPS[id].name,onclick:()=>openApp(id,b.querySelector('.ai').getBoundingClientRect())},aiIcon(id),h('span',{class:'n'},APPS[id].name));return b}
function renderGrid(){const v=q.value.trim().toLowerCase();const list=v?ALL.filter(i=>APPS[i].name.toLowerCase().includes(v)):GRID;
  grid.replaceChildren(...(list.length?list.map(tile):[h('div',{class:'empty'},ic('search_off'),'Ничего не найдено')]));dock.hidden=!!v}
dock.append(...DOCK.map(id=>{const t=tile(id);t.querySelector('.n').remove();return t}));
q.addEventListener('input',renderGrid);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=q.value.trim().toLowerCase();const m=ALL.find(i=>APPS[i].name.toLowerCase().includes(v));if(m){q.value='';renderGrid();q.blur();openApp(m)}}});
function goHome(){closeOverlays();tasks.slice().forEach(t=>minimize(t));if(q.value){q.value='';renderGrid()}}

/* ---------- недавние ---------- */
const rec=$('#recents');
function openRecents(){shadeClose(true);renderRecents();rec.hidden=false;rec.animate([{opacity:0},{opacity:1}],{duration:220})}
function closeRecents(){if(rec.hidden)return;rec.hidden=true}
function renderRecents(){
  if(!tasks.length){rec.replaceChildren(h('div',{class:'rempty'},ic('layers_clear'),'Нет недавних приложений'));return}
  const row=h('div',{class:'rrow'});
  tasks.slice().reverse().forEach(t=>{
    const card=h('div',{class:'rcard',role:'button',tabindex:'0','aria-label':t.def.name},
      h('div',{class:'rh'},aiIcon(t.id,'sm'),h('b',{},t.def.name),h('button',{class:'wb rx','aria-label':'Закрыть',onclick:e=>{e.stopPropagation();card.style.opacity=0;card.style.transform='translateY(-40px)';setTimeout(()=>closeTask(t),180)}},ic('close'))),
      h('div',{class:'rp'},aiIcon(t.id,'xl'),h('span',{},t.title.textContent)));
    const pick=()=>{closeRecents();const was=t.win.classList.contains('min');t.win.classList.remove('min');focusTask(t);if(was)popAnim(t.win)};
    let sy=0,dy=0,drag=false,moved=false;
    card.addEventListener('pointerdown',e=>{if(e.target.closest('.rx'))return;sy=e.clientY;dy=0;drag=true;moved=false;card.setPointerCapture(e.pointerId)});
    card.addEventListener('pointermove',e=>{if(!drag)return;dy=e.clientY-sy;if(Math.abs(dy)>6)moved=true;if(moved){card.style.transition='none';card.style.transform='translateY('+Math.min(0,dy)+'px)';card.style.opacity=1+Math.min(0,dy)/320}});
    card.addEventListener('pointerup',()=>{if(!drag)return;drag=false;card.style.transition='';if(dy<-110){card.style.opacity=0;card.style.transform='translateY(-120%)';setTimeout(()=>closeTask(t),200)}else{card.style.transform='';card.style.opacity='';if(!moved)pick()}});
    card.addEventListener('pointercancel',()=>{drag=false;card.style.transition='';card.style.transform='';card.style.opacity=''});
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
    row.append(card)});
  rec.replaceChildren(row,h('button',{class:'btn tonal rclear',onclick:()=>{tasks.slice().forEach(closeTask);renderRecents()}},ic('clear_all'),'Закрыть все'))}

/* ---------- шторка и статус ---------- */
const notes=[
  {id:1,app:'settings',icon:'info',title:'Добро пожаловать в ALFA OS',text:'Версия beta 0.1. Некоторые функции ещё дорабатываются.',time:Date.now()},
  {id:2,app:'notes',icon:'edit_note',title:'Заметки',text:'Создайте свою первую заметку.',time:Date.now()-60000}];
function notify(n){notes.unshift(Object.assign({id:Date.now(),time:Date.now()},n));renderNotes();renderStatus();if(!S.dnd)toast(n.title,n.icon)}
function renderNotes(){const l=$('#nlist');l.replaceChildren(...(notes.length?notes.map(n=>h('div',{class:'nitem',role:'button',tabindex:'0',onclick:e=>{if(e.target.closest('.iconbtn'))return;shadeClose();notes.splice(notes.indexOf(n),1);renderNotes();renderStatus();openApp(n.app)}},
  aiIcon(n.app,'sm'),h('div',{class:'lt'},h('b',{},n.title),h('small',{},n.text)),h('button',{class:'iconbtn','aria-label':'Скрыть',onclick:()=>{notes.splice(notes.indexOf(n),1);renderNotes();renderStatus()}},ic('close')))):[h('div',{class:'empty',style:'padding:18px'},'Уведомлений нет')]))}
let battery=87,charging=false;
try{if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{battery=Math.round(b.level*100);charging=b.charging;renderStatus()};u();b.addEventListener('levelchange',u);b.addEventListener('chargingchange',u)}).catch(()=>{})}catch(e){}
function renderStatus(){
  $('#sicons').replaceChildren(
    notes.length?h('i',{class:'dotn',title:'Есть уведомления'}):'',
    S.dnd?ic('do_not_disturb_on'):'',S.air?ic('flight'):'',S.bt&&!S.air?ic('bluetooth'):'',
    ic(S.wifi&&!S.air?'wifi':'wifi_off'),S.air?'':ic('signal_cellular_alt'),
    ic(charging?'battery_charging_full':S.saver?'battery_saver':'battery_full'),h('span',{},battery+'%'))}
const TILES=[['wifi','wifi','Wi‑Fi','wifi_off'],['bt','bluetooth','Bluetooth','bluetooth_disabled'],['dark','dark_mode','Тёмная тема'],['air','flight','Авиарежим'],['flash','flashlight_on','Фонарик','flashlight_off'],['dnd','do_not_disturb_on','Не беспокоить'],['saver','battery_saver','Экономия'],['mute','volume_off','Без звука','volume_up']];
function tileOn(k){return k==='dark'?isDark():S[k]}
function renderTiles(){$('#tiles').replaceChildren(...TILES.map(([k,i,n,off])=>{const on=tileOn(k);
  return h('button',{class:'qt','aria-pressed':on,onclick:()=>{
    if(k==='dark')setDark(!isDark());else{S[k]=!S[k];
      if(k==='air'){if(S.air){S.wifi=false;S.bt=false}else{S.wifi=true;S.bt=true}}
      if((k==='wifi'||k==='bt')&&S[k])S.air=false;
      if(k==='flash')toast(S.flash?'Фонарик включён':'Фонарик выключен','flashlight_on')}
    renderTiles();renderStatus();syncFlash()}},h('span',{class:'sh'},ic(on||!off?i:off)),n)}))}
function syncFlash(){$('#dim').style.background=S.flash?'#fff':'#000';$('#dim').style.opacity=S.flash?.28:(1-S.bright)*.75}
function shadeOpenFn(){if(shadeOpen||locked)return;shadeOpen=true;closeRecents();const sh=$('#shade');sh.hidden=false;renderTiles();renderNotes();tickClock();
  $('#slb').value=Math.round(S.bright*100);$('#slv').value=Math.round(S.vol*100);[$('#slb'),$('#slv')].forEach(r=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%'));
  $('#scrim').animate([{opacity:0},{opacity:1}],{duration:250});$('#panel').animate([{transform:'translateY(-30%)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.2,0,0,1)'})}
function shadeClose(instant){if(!shadeOpen)return;shadeOpen=false;const sh=$('#shade');if(instant){sh.hidden=true;return}
  $('#panel').animate([{transform:'none',opacity:1},{transform:'translateY(-20%)',opacity:0}],{duration:220,easing:'ease-in'});const an=$('#scrim').animate([{opacity:1},{opacity:0}],{duration:220});an.onfinish=()=>{if(!shadeOpen)sh.hidden=true}}
function closeOverlays(){closeRecents();shadeClose()}
$('#scrim').addEventListener('click',()=>shadeClose());
$('#lockbtn').addEventListener('click',()=>lockNow());
$('#nclear').addEventListener('click',()=>{notes.length=0;renderNotes();renderStatus()});
$('#slb').addEventListener('input',e=>{const r=e.target;S.bright=r.value/100;store.set('bright',S.bright);r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%');syncFlash()});
$('#slv').addEventListener('input',e=>{const r=e.target;S.vol=r.value/100;store.set('vol',S.vol);r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%')});
const st=$('#status');let sty=null,dragOpen=false;
st.addEventListener('pointerdown',e=>{sty=e.clientY;dragOpen=false});
st.addEventListener('pointermove',e=>{if(sty!=null&&e.clientY-sty>18&&!dragOpen){dragOpen=true;shadeOpenFn()}});
st.addEventListener('pointerup',()=>{sty=null});
st.addEventListener('click',()=>{if(dragOpen){dragOpen=false;return}shadeOpen?shadeClose():shadeOpenFn()});
st.addEventListener('keydown',e=>{if(e.key==='Enter')st.click()});st.tabIndex=0;

/* ---------- время ---------- */
function tickClock(){let d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),dt=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});dt=dt[0].toUpperCase()+dt.slice(1);
  $('#hclock').textContent=t;$('#hdate').textContent=dt;$('#lclock').textContent=t;$('#ldate').textContent=dt;$('#sclock').textContent=t;$('#shtime').textContent=t;$('#shdate').textContent=dt}
setInterval(tickClock,1000);

/* ---------- блокировка и загрузка ---------- */
const lock=$('#lock'),boot=$('#boot');
$('#lhtext').textContent=matchMedia('(pointer:coarse)').matches?'Проведите вверх':'Нажмите Enter или кликните';
function unlock(){if(!locked||booting)return;locked=false;lock.style.transition='transform .6s cubic-bezier(.2,0,0,1),opacity .6s';lock.style.transform='translateY(-100%)';lock.style.opacity='0';setTimeout(()=>{lock.hidden=true},620);
  setTimeout(()=>notify({app:'settings',icon:'lightbulb',title:'Совет',text:'Проведите вниз от верхней панели, чтобы открыть шторку.'}),9000)}
function lockNow(){closeOverlays();shadeClose(true);goHome();locked=true;lock.hidden=false;lock.style.transition='none';lock.style.transform='translateY(-100%)';lock.style.opacity='0';lock.offsetHeight;lock.style.transition='transform .5s cubic-bezier(.2,0,0,1),opacity .4s';lock.style.transform='';lock.style.opacity='1'}
let ly0=null,ldy=0;
lock.addEventListener('pointerdown',e=>{ly0=e.clientY;ldy=0;lock.setPointerCapture(e.pointerId);lock.style.transition='none'});
lock.addEventListener('pointermove',e=>{if(ly0==null)return;ldy=Math.min(0,e.clientY-ly0);lock.style.transform='translateY('+ldy+'px)'});
lock.addEventListener('pointerup',()=>{if(ly0==null)return;const d=ldy;ly0=null;if(d<-80||Math.abs(d)<8)unlock();else{lock.style.transition='transform .4s cubic-bezier(.34,1.56,.64,1)';lock.style.transform=''}});
lock.addEventListener('pointercancel',()=>{ly0=null;lock.style.transform=''});

const ease=p=>1-Math.pow(1-p,3),backOut=p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
let bootRaf,bootEnd=0;
function runBoot(){booting=true;locked=true;boot.hidden=false;boot.classList.remove('out');lock.hidden=false;lock.style.transition='none';lock.style.transform='';lock.style.opacity='1';
  const path=$('#bootpath'),bar=$('#bootbar'),t0=performance.now(),D=2800;bootEnd=0;
  function frame(now){const p=Math.min(1,(now-t0)/D);path.setAttribute('d',scallop(8,.1*backOut(Math.min(1,p*1.5)),now/700));bar.style.transform='scaleX('+ease(p)+')';
    if(p<1&&!bootEnd)bootRaf=requestAnimationFrame(frame);else finish()}
  function finish(){if(bootEnd===2)return;bootEnd=2;booting=false;boot.classList.add('out');setTimeout(()=>{boot.hidden=true},620)}
  boot.onclick=()=>{if(performance.now()-t0>500){bootEnd=1}};
  bootRaf=requestAnimationFrame(frame)}
function reboot(){closeOverlays();tasks.slice().forEach(t=>{t.cleanups.forEach(f=>{try{f()}catch(e){}});t.win.remove()});tasks.length=0;S.flash=false;syncFlash();runBoot()}

/* ---------- навигация ---------- */
function back(){if(locked||booting)return;
  if(!rec.hidden){closeRecents();return}
  if(shadeOpen){shadeClose();return}
  const t=fg();
  if(t){if(t.inst.back&&t.inst.back())return;closeTask(t);return}
  if(q.value){q.value='';renderGrid()}}
function home(){if(locked||booting)return;goHome()}
function recents(){if(locked||booting)return;rec.hidden?openRecents():closeRecents()}
$('#nback').addEventListener('click',back);$('#nhome').addEventListener('click',home);$('#nrec').addEventListener('click',recents);
rec.addEventListener('click',e=>{if(e.target===rec||e.target.classList.contains('rrow')||e.target.classList.contains('rempty'))closeRecents()});

addEventListener('keydown',e=>{
  if(booting){if(performance.now()>600)bootEnd=bootEnd||1;return}
  if(locked){if(['Enter',' ','ArrowUp'].includes(e.key)){e.preventDefault();unlock()}return}
  const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='range';
  if(e.key==='Escape'){e.preventDefault();back();return}
  if(typing)return;
  if(e.key==='Home'){e.preventDefault();home();return}
  if(e.key==='End'){e.preventDefault();recents();return}
  const t=fg();if(t&&t.inst.key&&rec.hidden&&!shadeOpen&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(BUTTON|A)$/.test(e.target.tagName)){if(t.inst.key(e))e.preventDefault()}
  else if(t&&t.inst.key&&rec.hidden&&!shadeOpen&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key!=='Enter'&&e.key!==' '){if(t.inst.key(e))e.preventDefault()}});

/* ---------- адаптация ПК / телефон ---------- */
const mq=matchMedia('(min-width:900px)');
function setMode(){desk=mq.matches;os.classList.toggle('desk',desk);os.style.setProperty('--navpad',desk?'20px':'100px');
  tasks.forEach(t=>{if(!desk){t.win.style.width=t.win.style.height='';t.win.classList.remove('max')}
    else if(!t.win.style.getPropertyValue('--w')){const W=wins.clientWidth,H=wins.clientHeight,[sw,sh]=t.def.size;t.win.style.setProperty('--w',Math.min(sw,W-24)+'px');t.win.style.setProperty('--hh',Math.min(sh,H-136)+'px');t.win.style.setProperty('--x','40px');t.win.style.setProperty('--y','56px')}});
  if(!desk&&tasks.length){const t=fg()||tasks[tasks.length-1];tasks.forEach(o=>{if(o!==t)o.win.classList.add('min')});t.win.classList.remove('min')}}
mq.addEventListener('change',setMode);
document.addEventListener('visibilitychange',()=>{});

applyTheme();setMode();renderGrid();renderStatus();renderNotes();tickClock();runBoot();
})();
</script>

</body></html>
