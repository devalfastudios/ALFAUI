<title>ALFA OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Outfit:wght@300..700&family=Figtree:wght@400..700&display=swap">
<style>

  --outline:oklch(.78 .03 var(--h));
  --error:oklch(.55 .21 25);
  --on-error:oklch(.99 .01 25);

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ---------- обои ---------- */
.wall{inset:0;overflow:hidden;background:var(--surface)}
.wall i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.95;will-change:transform}
.wall .b1{width:72vmax;height:72vmax;left:-24vmax;top:-28vmax;background:var(--primary-c);animation:drift 28s ease-in-out infinite alternate}

.wall.w1 i{filter:none;border-radius:34%;opacity:.8}

#home{inset:0;display:flex;flex-direction:column;gap:18px;padding:56px max(20px,env(safe-area-inset-left)) 92px;width:100%;max-width:1060px;left:50%;transform:translateX(-50%);z-index:1}

.search:focus-within{background:var(--surf-3);border-radius:20px}

#dock .tile{padding:2px}

/* иконки-фигуры */
.tone-p{--ib:var(--primary-c);--if:var(--on-primary-c)}
.tone-s{--ib:var(--secondary-c);--if:var(--on-secondary-c)}

/* ---------- общие элементы ---------- */
.page{flex:1;min-height:0;overflow:auto;padding:4px max(16px,env(safe-area-inset-left)) 20px;display:flex;flex-direction:column;gap:12px}
.group{display:flex;flex-direction:column;gap:3px;border-radius:28px;overflow:hidden}
.li{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border:0;background:var(--surf-1);text-align:left;min-height:64px;transition:background .2s}
.li:hover{background:var(--surf-2)}
.li .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.li small{color:var(--on-surface-v);font-size:13px}
.li>.ms:first-child{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);font-weight:600;transition:border-radius .35s var(--spring),transform .2s,filter .2s}
.btn:hover{border-radius:16px;filter:brightness(1.06)}
.btn:active{transform:scale(.95)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf-2);display:grid;place-items:center;transition:border-radius .3s var(--spring),background .2s}
.iconbtn:hover{border-radius:14px;background:var(--surf-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surf-2);border-radius:28px;align-self:center}
.seg button{border:0;background:transparent;border-radius:24px;padding:10px 18px;font-weight:600;color:var(--on-surface-v);transition:background .25s,border-radius .3s var(--spring)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.chip{border:1px solid var(--outline);background:transparent;border-radius:12px;padding:8px 14px;font-weight:500;transition:background .2s}
.chip[aria-pressed=true]{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent}
.fab{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--navpad,100px) + 4px);display:flex;align-items:center;gap:10px;height:64px;padding:0 24px;border:0;border-radius:22px;background:var(--tertiary-c);color:var(--on-tertiary-c);font-weight:700;box-shadow:var(--shadow);transition:border-radius .4s var(--spring),transform .2s}
.fab:hover{border-radius:32px}.fab:active{transform:scale(.94)}
.desk .fab{bottom:20px}
.card{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:0;border-radius:24px;background:var(--surf-1);text-align:left;transition:background .2s,border-radius .35s var(--spring)}
.card:hover{background:var(--surf-2);border-radius:30px}
.card small{color:var(--on-surface-v)}
.card span{color:var(--on-surface-v)}
.sw{width:56px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surf-3);position:relative;padding:0;flex:none;transition:background .25s,border-color .25s}
.sw i{position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:left .35s var(--spring),width .2s,height .2s,background .2s}
.sw:active i{width:22px;height:22px}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true] i{left:28px;width:24px;height:24px;background:var(--on-primary)}
.sw[aria-checked=true]:active i{left:24px;width:28px;height:28px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:18px;border-radius:9px;background:linear-gradient(90deg,var(--primary) var(--p),var(--surf-3) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:44px;border-radius:3px;background:var(--primary);margin-top:-13px;box-shadow:0 0 0 4px var(--surface)}
input[type=range]::-moz-range-track{height:18px;border-radius:9px;background:var(--surf-3)}
input[type=range]::-moz-range-progress{height:18px;border-radius:9px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:6px;height:44px;border:0;border-radius:3px;background:var(--primary);box-shadow:0 0 0 4px var(--surface)}
.sl{display:flex;align-items:center;gap:14px}
.sl>.ms{color:var(--on-surface-v)}
.hero{display:flex;align-items:center;gap:18px;padding:18px;border-radius:28px;background:var(--primary-c);color:var(--on-primary-c)}
.hero svg{width:72px;height:72px;flex:none}
.hero b{font:600 24px var(--display);display:block}
.sub{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-v);padding:10px 6px 0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:6px}
.swatch{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;transition:border-radius .4s var(--spring),transform .2s}
.swatch[aria-pressed=true]{border-radius:30%}
.swatch:hover{transform:scale(1.08)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp{height:112px;border-radius:22px;border:3px solid transparent;overflow:hidden;position:relative;padding:0;background:var(--surface);transition:border-radius .4s var(--spring)}
.wp[aria-pressed=true]{border-color:var(--primary);border-radius:32px}
.wp i{position:absolute;border-radius:50%;filter:blur(14px)}
.wp .a{width:70%;height:70%;left:-10%;top:-10%;background:var(--primary-c)}
.wp .b{width:70%;height:70%;right:-10%;bottom:-10%;background:var(--tertiary-c)}
.wp.p1 i{filter:none;border-radius:34%;transform:rotate(20deg)}
.wp.p2{background:linear-gradient(165deg,var(--primary-c),var(--surface) 55%,var(--tertiary-c))}
.wp.p2 i{display:none}
.wp span{position:absolute;left:0;right:0;bottom:6px;font-size:12px;font-weight:600;text-align:center}

/* ---------- калькулятор ---------- */
.calc{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-left)) 14px;gap:12px}
.cdisp{flex:1;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 12px;overflow:hidden}
.cs{color:var(--on-surface-v);min-height:22px;font-size:16px}
.cd{font:500 64px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{height:clamp(52px,9vh,72px);border:0;border-radius:50%;background:var(--surf-2);font:500 26px var(--display);transition:border-radius .35s var(--spring),transform .15s,background .2s}
.ck:hover{border-radius:26px}
.ck:active{transform:scale(.93)}
.ck.o{background:var(--secondary-c);color:var(--on-secondary-c)}
.ck.f{background:var(--surf-3)}
.ck.e{background:var(--primary);color:var(--on-primary)}

/* ---------- часы ---------- */
.ctab{padding:0 16px 10px;display:flex;justify-content:center}
.clk{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 16px 20px}
.clk svg{width:min(70vw,280px);height:auto;max-height:42vh}
.big{font:500 clamp(48px,14vw,76px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.laps{width:min(100%,360px);display:flex;flex-direction:column;gap:2px;max-height:160px;overflow:auto}
.laps div{display:flex;justify-content:space-between;padding:8px 16px;background:var(--surf-1);font-variant-numeric:tabular-nums}

/* ---------- календарь ---------- */
.cal{flex:1;min-height:0;overflow:auto;padding:0 max(16px,env(safe-area-inset-left)) 20px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:8px}
.chead h3{flex:1;font:600 24px var(--display);text-transform:capitalize}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cgrid .wd{font-size:12px;font-weight:600;color:var(--on-surface-v);padding:6px 0}
.cgrid button{aspect-ratio:1;max-height:56px;border:0;border-radius:50%;background:transparent;font-weight:500;font-variant-numeric:tabular-nums;transition:border-radius .35s var(--spring),background .2s}
.cgrid button:hover{background:var(--surf-2);border-radius:30%}
.cgrid button.today{background:var(--primary);color:var(--on-primary)}
.cgrid button.sel:not(.today){background:var(--primary-c);color:var(--on-primary-c);border-radius:30%}

/* ---------- игра, пианино, рисование ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px 16px}
.score{display:flex;gap:12px}
.score div{padding:8px 18px;border-radius:20px;background:var(--surf-2);display:flex;gap:8px;align-items:baseline}
.score b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.stage{position:relative;flex:1;min-height:0;width:100%;display:grid;place-items:center}
.scv{width:min(100%,100cqh,520px);aspect-ratio:1;border-radius:28px;display:block;background:var(--surf-1);touch-action:none;max-height:100%}
.stage{container-type:size}
.sov{position:absolute;inset:0;margin:auto;width:min(100%,100cqh,520px);aspect-ratio:1;border-radius:28px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.sov h3{font:600 28px var(--display)}
.piano{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 max(16px,env(safe-area-inset-left)) 16px}
.keys{position:relative;flex:1;min-height:220px;display:flex;gap:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.piano .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.piano .row b{min-width:78px;text-align:center}
@media (max-height:480px){.piano{gap:6px;padding-bottom:8px}.piano .hint{display:none}.keys{min-height:120px}}
.wk{flex:1;border:1px solid var(--outline);border-radius:0 0 18px 18px;background:var(--surface);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;color:var(--on-surface-v);transition:background .1s;touch-action:none}
.wk.on{background:var(--primary-c)}
.bk{position:absolute;top:0;height:60%;width:6%;border:0;border-radius:0 0 12px 12px;background:var(--on-surface);z-index:2;touch-action:none;transition:background .1s}
.bk.on{background:var(--primary)}
.dtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-left)) 12px}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;transition:border-radius .35s var(--spring),transform .2s}
.dot[aria-pressed=true]{border-color:var(--on-surface);border-radius:30%}
.dtools input[type=range]{width:130px}
.dwrap{position:relative;flex:1;min-height:0;margin:0 max(16px,env(safe-area-inset-left)) 16px;border-radius:24px;overflow:hidden;background:#fbfbf8}
.dwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---------- заметки ---------- */
.note{gap:6px}
.note b{font:600 18px var(--display)}
.ni{height:56px;border:0;border-radius:18px;background:var(--surf-1);padding:0 18px;font:600 20px var(--display);outline:0}
.nt{flex:1;min-height:140px;border:0;border-radius:22px;background:var(--surf-1);padding:16px 18px;resize:none;outline:0;line-height:1.5}
.ni:focus,.nt:focus{background:var(--surf-2)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap}
.frow .ai{width:44px;height:44px}.frow .ai .ms{font-size:22px}
.info{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:24px;background:var(--tertiary-c);color:var(--on-tertiary-c)}

/* ---------- верхняя панель ---------- */
#status{left:0;right:0;top:0;height:40px;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,env(safe-area-inset-left));font:600 14px var(--display);cursor:pointer;background:transparent;border:0}
#status>*{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#status .ms{font-size:18px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20}
#status .dotn{width:8px;height:8px;border-radius:50%;background:var(--primary)}

/* ---------- батарея и зарядка ---------- */
#status .bat{display:inline-flex;align-items:center;gap:6px;transition:color .3s}
#status .bat.lo{color:#ff4d4f}
#status .bat.mid{color:#ffd60a}
#status .bat.sv{color:#ff8a1f}
#status .bat.chg{color:#34d96b}
#chg{position:absolute;inset:0;z-index:58;pointer-events:none;overflow:hidden;display:grid;place-items:center;color:#fff}
#chg .cs{position:absolute;inset:0;background:rgb(0 0 0/.42)}
#chg .ms{font-variation-settings:'FILL' 1,'wght' 600}
#chg .cn{display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 2px 14px rgb(0 0 0/.35)}
#chg .cn .ms{font-size:40px;color:#34d96b}
#chg .cn b{font:600 46px var(--display);font-variant-numeric:tabular-nums}
#chg .cn small,#chg .bt small{font:500 14px var(--body);opacity:.85}
#chg .cr{position:relative;width:min(62vw,240px);aspect-ratio:1;display:grid;place-items:center}
#chg .cr::before{content:'';position:absolute;inset:-16px;border-radius:50%;background:rgb(18 22 20/.78)}
#chg .cr svg{position:absolute;inset:0;width:100%;height:100%}
#chg .cr circle{fill:none;stroke-width:9;stroke-linecap:round}
#chg .cr .t{stroke:rgb(255 255 255/.2)}
#chg .cr .p{stroke:#34d96b;stroke-dasharray:326.7;stroke-dashoffset:326.7}
#chg .cr .cn{position:relative}
#chg.chg-wave .cs{background:rgb(0 0 0/.2)}
#chg .wv{position:absolute;inset:0;background:linear-gradient(to top,rgb(38 200 92/.66),rgb(52 217 107/.32));transform:translateY(100%)}
#chg .wv svg{position:absolute;left:0;top:-19px;width:200%;height:20px;fill:rgb(52 217 107/.32)}
#chg.chg-wave .cn{position:relative}
#chg .bz{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px}
#chg .bc{position:relative;width:112px;height:112px;border-radius:50%;background:#34d96b;display:grid;place-items:center;box-shadow:0 10px 40px rgb(52 217 107/.45)}
#chg .bc .ms{font-size:60px;color:#06381a}
#chg .rp{position:absolute;left:50%;top:56px;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid #34d96b;opacity:0}
#chg .bt{display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 14px rgb(0 0 0/.35)}
#chg .bt b{font:600 40px var(--display);font-variant-numeric:tabular-nums}

/* ---------- шторка ---------- */
#shade{inset:0;z-index:6}
#shade .scrim{position:absolute;inset:0;background:rgb(0 0 0 / .38)}
#shade .panel{position:absolute;top:0;right:0;width:min(100%,440px);max-height:100%;overflow:auto;padding:52px 16px 18px;background:var(--surface);border-radius:0 0 36px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.sh-time{font:600 34px var(--display);letter-spacing:-.02em}
.sh-date{color:var(--on-surface-v)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.qt{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-size:12px;font-weight:500;color:var(--on-surface-v)}
.qt span.sh{width:100%;max-width:78px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--surf-3);color:var(--on-surface);transition:border-radius .45s var(--spring),background .25s,transform .15s}
.qt:active span.sh{transform:scale(.9)}
.qt[aria-pressed=true] span.sh{background:var(--primary);color:var(--on-primary);border-radius:30%}
.nh{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.nh h3{font:600 16px var(--display)}
.nitem{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:24px;background:var(--surf-1);border:0;width:100%;text-align:left}
.nitem .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.nitem small{color:var(--on-surface-v)}
.nitem .iconbtn{width:36px;height:36px;background:transparent}

/* ---------- недавние ---------- */
#recents{inset:0;z-index:4;background:color-mix(in oklab,var(--surface) 90%,transparent);backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:center;padding:60px 0 100px}
.rrow{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px max(24px,calc(50% - 140px));align-items:center}
.rcard{flex:none;width:min(280px,72vw);height:min(52vh,400px);scroll-snap-align:center;border-radius:32px;background:var(--surf-2);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-x;cursor:pointer;transition:transform .35s var(--spring),opacity .3s;box-shadow:0 4px 16px rgb(0 0 0 / .12)}
.rcard:hover{transform:translateY(-6px)}
.rh{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 14px}
.rh b{flex:1;font:600 15px var(--display)}
.rp{flex:1;margin:0 10px 10px;border-radius:24px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:12px;color:var(--on-surface-v);font-size:13px}
.rclear{align-self:center;margin-top:8px}
.rempty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--on-surface-v)}
.rempty .ms{font-size:48px}

/* ---------- панель навигации ---------- */
#nav{left:50%;bottom:10px;transform:translateX(-50%);z-index:7;display:flex;gap:4px;padding:4px;background:var(--surf-3);border-radius:26px;box-shadow:var(--shadow)}
#os:not(.gest) #shade .panel,#os.desk #shade .panel{max-height:calc(100% - 70px)}
#nav button{width:64px;height:38px;border-radius:19px;border:0;background:transparent;color:var(--on-surface);display:grid;place-items:center;transition:background .2s,border-radius .4s var(--spring),transform .2s}
#nav button:hover{background:color-mix(in oklab,var(--on-surface) 10%,transparent)}
#nav button:active{background:var(--primary-c);border-radius:18px;transform:scale(.93)}
#nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}

/* ---------- блокировка и загрузка ---------- */
#lock{inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;padding:84px max(28px,env(safe-area-inset-left)) 40px;touch-action:none;cursor:pointer}
#lock{background:var(--surface)}
#lock .bg{position:absolute;inset:0;z-index:-1}
#lclock{font:600 clamp(88px,22vw,190px)/.9 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
#ldate{font:500 22px var(--display);color:var(--on-surface-v);margin-top:10px}
.lhint{align-self:center;display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:26px;background:var(--surf-3);font-weight:600;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.lnote{margin-top:22px;display:flex;flex-direction:column;gap:8px;max-width:420px}
#lclock{font-size:calc(clamp(88px,22vw,190px)*var(--lsz,1))}
#lock.acc #lclock{color:var(--primary)}
#lock.center .lbox{display:flex;flex-direction:column;align-items:center;text-align:center}
.lmsg{margin-top:14px;display:inline-block;max-width:420px;padding:10px 18px;border-radius:20px;background:var(--surf-3);font:500 18px/1.3 var(--display)}
.lnote .nitem{background:var(--surf-3)}
.lprev{height:150px;border-radius:28px;background:linear-gradient(150deg,var(--primary-c),var(--tertiary-c));padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.lprev.c{align-items:center;text-align:center}
.lprev .pt{font:600 44px/1 var(--display);letter-spacing:-.04em}
.lprev.acc .pt{color:var(--primary)}
.lprev .pd{font-weight:500;color:var(--on-surface-v)}
.lprev .pm{margin-top:8px;font-size:13px;padding:6px 12px;border-radius:14px;background:var(--surf-3);align-self:flex-start}
.lprev.c .pm{align-self:center}
#dev,#bezel{display:contents}.hwb{display:none}
body.dev{background:oklch(.12 .01 var(--h))}
body.dev #dev{display:grid;place-items:center;height:100%;width:100%}
body.dev #bezel{display:block;position:relative;height:min(calc(94dvh - 2*var(--bt,7px)),calc((100vw - 28px)*var(--arh,2.167)));aspect-ratio:var(--ar,9/19.5);max-width:calc(100vw - 28px)}
body.dev #os{position:absolute;inset:0;height:auto;border-radius:var(--br,46px);box-shadow:0 0 0 7px #0b0b0d,0 0 0 9px #3a3a40,0 24px 70px rgb(0 0 0/.55);container-type:size;isolation:isolate}
body.dev .hwb{display:block;position:absolute;border:0;padding:0;background:linear-gradient(90deg,#2b2b30,#55555c);cursor:pointer;z-index:0;transition:transform .12s,filter .12s}
body.dev .hwb:hover{filter:brightness(1.35)}

/* ===== v11: разблокировка как в HyperOS (только transform/opacity — без filter, не лагает) ===== */

@keyframes uw2{from{scale:1.2}}

/* ===== v12: recovery touch ===== */
#rcv{z-index:99;pointer-events:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}

/* ===== v12: мгновенный отклик нажатия (не ждём :active) ===== */
.pr{scale:.95!important;opacity:.86;transition:scale .05s linear,opacity .05s linear!important;will-change:scale,opacity}

.tile.pr{scale:1!important}.tile.pr .ai{scale:.86;transition:scale .07s ease-out}

.tile.prr .ai{transition:scale .42s cubic-bezier(.34,1.8,.5,1)}
/* ===== v12: ещё лёгкая разблокировка ===== */
#os.lk #grid>*,#os.lk #dock>*,#os.lk #wall,#os.lk #lock{will-change:transform,opacity}
#os.unl .wall i,#os.unl #lock i{animation-play-state:paused!important}
#os.unl #wall{animation-duration:.8s}
#os.unl #grid>*,#os.unl #dock>*{animation-duration:.5s}
.uflash{will-change:opacity;animation-duration:.5s}

/* ===== v13: иконки скрыты под замком, мягкий вход ===== */
#os.lk #home{visibility:hidden;opacity:0}
#os.unl #home>*:not(#grid):not(#dock){animation:ufade .4s ease-out .12s backwards}
@keyframes ufade{from{opacity:0}}
#os.lite .uflash{display:none}
#os.lite.unl #wall{animation-duration:.6s}
#os.idlewall .wall i{animation-play-state:paused!important}

/* ===== v15: отклик, цвет корпуса, выдвижная камера ===== */
html,body{overscroll-behavior:none}
button,.li,.srow,.nitem,.card,.sw{touch-action:manipulation;-webkit-touch-callout:none}
.prr{transition:scale .34s cubic-bezier(.34,1.8,.5,1),opacity .2s!important}

}

}

  const grid=h('div',{class:'gmb',style:'grid-template-columns:repeat(4,1fr)'}),mv=h('b',{},'0'),bs=h('b',{},best?String(best):'—');
  const ov=gOverlay('Пятнашки','Расставьте числа по порядку. Нажмите на плитку рядом с пустой клеткой',start);
  a.el.append(h('div',{class:'game'},h('div',{class:'score'},h('div',{},'Ходы',mv),h('div',{},'Рекорд',bs)),h('div',{class:'stage'},grid,ov)));
  function shuffle(){T=[...Array(15).keys()].map(i=>i+1).concat(0);let e=15,prev=-1;for(let k=0;k<250;k++){const x=e%4,y=e>>2,c=[];if(x>0)c.push(e-1);if(x<3)c.push(e+1);if(y>0)c.push(e-4);if(y<3)c.push(e+4);const m=c.filter(j=>j!==prev),j=m[rand(m.length)];[T[e],T[j]]=[T[j],T[e]];prev=e;e=j}}
  function paint(){grid.replaceChildren(...T.map((v,i)=>{const b=h('button',{'aria-label':v?String(v):'Пусто'},v?String(v):'');if(!v)b.style.visibility='hidden';else if(v===i+1)b.className='ok';b.onclick=()=>tap(i);return b}))}
  function start(){shuffle();moves=0;mv.textContent='0';state='run';ov.hidden=true;paint()}
  function tap(i){if(state!=='run')return;const e=T.indexOf(0),x=i%4,y=i>>2,ex=e%4,ey=e>>2;if(i===e||(x!==ex&&y!==ey))return;
    if(y===ey){const d=x<ex?1:-1;for(let k=e;k!==i;k-=d)T[k]=T[k-d]}else{const d=y<ey?4:-4;for(let k=e;k!==i;k-=d)T[k]=T[k-d]}
    T[i]=0;moves++;mv.textContent=moves;paint();
    if(T.every((v,j)=>v===(j+1)%16)){state='over';if(!best||moves<best){best=moves;store.set('slide15',moves);bs.textContent=moves}ov.set('Готово!','Ходов: '+moves);setTimeout(()=>{ov.hidden=false},600)}}
  shuffle();paint();ov.hidden=false;
  return{key(e){if(state!=='run'){if(e.key===' '||e.key==='Enter'){start();return true}return false}const em=T.indexOf(0),ex=em%4,ey=em>>2;
    if(e.key==='ArrowUp'&&ey<3)tap(em+4);else if(e.key==='ArrowDown'&&ey>0)tap(em-4);else if(e.key==='ArrowLeft'&&ex<3)tap(em+1);else if(e.key==='ArrowRight'&&ex>0)tap(em-1);else return false;return true}};
}

function spaceApp(a){
  const W=640,H=360,sh=landShell(a,W,H),cv=sh.cv,ctx=cv.getContext('2d'),col=mkCol(a.el);
  let ship={y:H/2},bul=[],en=[],score=0,lives=3,state='idle',last=performance.now(),fireT=0,spawnT=0,inv=0,best=store.get('space',0);
  const hold={up:0,dn:0,fire:0},kv={};
  const stars=Array.from({length:40},()=>({x:rand(W),y:rand(H),s:.5+Math.random()*2}));
  const sc=h('b',{},'0'),lv=h('b',{},'3'),bs=h('b',{},String(best));
  sh.bar.prepend(h('div',{class:'score'},h('div',{},'Счёт',sc),h('div',{},'Жизни',lv),h('div',{},'Рекорд',bs)));
  const ov=gOverlay('Космобой',(sh.rot()?'Экран повёрнут — держите телефон горизонтально. ':'')+'Кнопки ▲▼ — движение, молния — огонь (можно держать)',start);
  sh.area.append(h('div',{class:'lctl l'},holdBtn('keyboard_arrow_up',hold,'up'),holdBtn('keyboard_arrow_down',hold,'dn')),h('div',{class:'lctl r'},holdBtn('bolt',hold,'fire')),ov);
  function start(){ship={y:H/2};bul=[];en=[];score=0;lives=3;inv=0;fireT=0;spawnT=300;sc.textContent='0';lv.textContent='3';state='run';last=performance.now();ov.hidden=true}
  function hurt(){lives--;lv.textContent=lives;inv=1300;if(lives<=0){state='over';if(score>best){best=score;store.set('space',best);bs.textContent=best}ov.set('Корабль уничтожен','Счёт: '+score);ov.hidden=false}}
  function step(){const now=performance.now(),dt=Math.min(2.5,(now-last)/16.67);last=now;
    stars.forEach(s=>{s.x-=s.s*dt;if(s.x<0){s.x=W;s.y=rand(H)}});
    if(state==='run'&&a.active()){
      const up=hold.up||kv.ArrowUp||kv.w,dn=hold.dn||kv.ArrowDown||kv.s,fire=hold.fire||kv[' '];
      if(up)ship.y-=4.4*dt;if(dn)ship.y+=4.4*dt;ship.y=Math.max(18,Math.min(H-18,ship.y));
      fireT-=16.67*dt;if(fire&&fireT<=0){bul.push({x:70,y:ship.y});fireT=170}
      spawnT-=16.67*dt;if(spawnT<=0){en.push({x:W+20,y:24+rand(H-48),v:2+Math.random()*1.5+Math.min(3,score/150),ph:Math.random()*6,w:Math.random()<.4});spawnT=Math.max(380,1000-score*3)}
      bul.forEach(b=>b.x+=9*dt);bul=bul.filter(b=>b.x<W+10);
      en.forEach(e=>{e.x-=e.v*dt;if(e.w)e.y=Math.max(16,Math.min(H-16,e.y+Math.sin((e.x+e.ph*40)/30)*1.6*dt))});
      inv=Math.max(0,inv-16.67*dt);
      for(const e of en){for(const b of bul){if(!e.dead&&Math.abs(b.x-e.x)<20&&Math.abs(b.y-e.y)<16){e.dead=1;b.x=1e4;score+=10;sc.textContent=score}}
        if(!e.dead&&!inv&&Math.abs(e.x-50)<26&&Math.abs(e.y-ship.y)<20){e.dead=1;hurt()}}
      en=en.filter(e=>!e.dead&&e.x>-30)}
    draw()}
  function draw(){ctx.fillStyle=col('--surf-1');ctx.fillRect(0,0,W,H);ctx.fillStyle=col('--on-surface-v');stars.forEach(s=>{ctx.globalAlpha=.25+s.s/4;ctx.fillRect(s.x,s.y,s.s+.5,s.s+.5)});ctx.globalAlpha=1;
    if(!(inv>0&&Math.floor(inv/120)%2)){ctx.fillStyle=col('--primary');ctx.beginPath();ctx.moveTo(72,ship.y);ctx.lineTo(34,ship.y-17);ctx.lineTo(42,ship.y);ctx.lineTo(34,ship.y+17);ctx.closePath();ctx.fill()}
    ctx.fillStyle=col('--tertiary');bul.forEach(b=>{ctx.beginPath();ctx.roundRect(b.x,b.y-2,14,4,2);ctx.fill()});
    en.forEach(e=>{ctx.fillStyle=e.w?'#e5484d':col('--on-surface-v');ctx.beginPath();ctx.roundRect(e.x-16,e.y-14,32,28,e.w?14:7);ctx.fill();ctx.fillStyle=col('--surf-1');ctx.fillRect(e.x-8,e.y-4,5,5);ctx.fillRect(e.x+2,e.y-4,5,5)})}
  a.every(step,16);
  return{key(e){const k=e.key.length===1?e.key.toLowerCase():e.key;if(!['ArrowUp','ArrowDown','w','s',' '].includes(k))return false;
    if(state!=='run'){if(k===' ')start();return true}
    if(!kv[k]){kv[k]=1;const u=ev=>{const kk=ev.key.length===1?ev.key.toLowerCase():ev.key;if(kk===k){delete kv[k];removeEventListener('keyup',u)}};addEventListener('keyup',u)}return true}};
}

/* Бегун (горизонтальная) */
function runnerApp(a){
  const W=640,H=360,G=290,sh=landShell(a,W,H),cv=sh.cv,ctx=cv.getContext('2d'),col=mkCol(a.el);
  let pb=G,pv=0,obs=[],spd=6,dist=0,state='idle',last=performance.now(),nextO=300,best=store.get('runner',0);
  const clouds=Array.from({length:4},(_,i)=>({x:i*180+rand(80),y:30+rand(90),s:.3+Math.random()*.4}));
  const sc=h('b',{},'0'),bs=h('b',{},String(best));
  sh.bar.prepend(h('div',{class:'score'},h('div',{},'Счёт',sc),h('div',{},'Рекорд',bs)));
  const ov=gOverlay('Бегун',(sh.rot()?'Экран повёрнут — держите телефон горизонтально. ':'')+'Тап по экрану — прыжок. Перепрыгивайте кактусы',start);
  const jump=()=>{if(state==='run'&&pb>=G-.5)pv=-13};
  sh.area.append(h('div',{class:'lctl r'},gpb('keyboard_arrow_up',jump)),ov);
  sh.area.addEventListener('pointerdown',e=>{if(e.target.closest('.sov'))return;jump()});
  function start(){pb=G;pv=0;obs=[];spd=6;dist=0;nextO=300;sc.textContent='0';state='run';last=performance.now();ov.hidden=true}
  function over(){state='over';const s=dist/10|0;if(s>best){best=s;store.set('runner',best);bs.textContent=best}ov.set('Врезались!','Счёт: '+s);ov.hidden=false}
  function step(){const now=performance.now(),dt=Math.min(2.5,(now-last)/16.67);last=now;
    clouds.forEach(c=>{c.x-=c.s*dt*(state==='run'?spd/3:.4);if(c.x<-60){c.x=W+rand(100);c.y=30+rand(90)}});
    if(state==='run'&&a.active()){pv+=.7*dt;pb+=pv*dt;if(pb>=G){pb=G;pv=0}
      spd=Math.min(13,6+dist/1200);dist+=spd*dt;sc.textContent=dist/10|0;
      nextO-=spd*dt;if(nextO<=0){const bird=dist>2500&&Math.random()<.35;obs.push(bird?{x:W+20,w:40,h:22,b:G-58,bird:1}:{x:W+20,w:16+rand(16),h:30+rand(34),b:G});nextO=380+rand(280)+spd*16}
      obs.forEach(o=>o.x-=spd*dt);obs=obs.filter(o=>o.x>-60);
      for(const o of obs){if(o.x+3<92&&o.x+o.w-3>68&&pb-3>o.b-o.h&&pb-38<o.b-3){over();break}}}
    draw()}
  function draw(){ctx.fillStyle=col('--surf-1');ctx.fillRect(0,0,W,H);ctx.fillStyle=col('--surf-3');clouds.forEach(c=>{ctx.beginPath();ctx.roundRect(c.x,c.y,60,16,8);ctx.fill()});
    ctx.fillStyle=col('--surf-3');ctx.fillRect(0,G,W,H-G);ctx.fillStyle=col('--outline');ctx.fillRect(0,G,W,2);
    obs.forEach(o=>{ctx.fillStyle=o.bird?'#e5484d':col('--tertiary');ctx.beginPath();ctx.roundRect(o.x,o.b-o.h,o.w,o.h,o.bird?11:5);ctx.fill()});
    ctx.fillStyle=col('--primary');ctx.beginPath();ctx.roundRect(68,pb-40,26,40,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(84,pb-32,6,6)}
  a.every(step,16);
  return{key(e){if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w'){if(state==='run')jump();else start();return true}return false}};
}

  h('button',{class:'li',onclick:()=>{closeMenu();L.dock=L.dock.filter(x=>x!==id);if(!L.pages.some(p=>p.includes(id)))L.grid.push(id);store.set('layout',L);renderGrid();renderDock();toast('Убрано из закреплённых','keep_off')}},ic('keep_off'),'Убрать из закреплённых'));
 m.style.left=Math.max(8,Math.min(r.left,innerWidth-240))+'px';m.style.top=Math.max(8,r.top-130)+'px';document.body.append(m);
 m.animate([{opacity:0,scale:.6},{opacity:1,scale:1}],{duration:300,easing:spring});
 const off=e=>{if(!e.target.closest('.menu')){closeMenu();removeEventListener('pointerdown',off,true)}};setTimeout(()=>addEventListener('pointerdown',off,true),0)}

/* ===== v8: отклик ===== */
let HAP=store.get('haptic',matchMedia('(pointer:coarse)').matches);
document.addEventListener('pointerdown',e=>{if(!HAP||S.mute||!navigator.vibrate||e.pointerType==='mouse')return;if(e.target.closest&&e.target.closest('.tile,.li,.btn,.iconbtn,.chip,.qt,#nav button,.pk,.ck,.cgrid button,#kb .k,.wb,.seg button,.sw'))try{navigator.vibrate(6)}catch(_){}},{passive:true,capture:true});
/* авто-режим производительности: если кадры медленные — упрощаем эффекты один раз */
setTimeout(()=>{if(PERF||store.get('perfauto',0)||document.hidden)return;let n=0,t0=0,sum=0,last=0;const f=t=>{if(last){sum+=t-last;n++}last=t;if(!t0)t0=t;if(t-t0<1500){requestAnimationFrame(f)}else if(n>20&&sum/n>26&&!document.hidden){store.set('perfauto',1);setPerf(true);toast('Система тормозила — включён режим производительности','speed')}};requestAnimationFrame(f)},6000);
})();

/* мгновенный отклик нажатия */
(()=>{const SEL='.tile,.li,.btn,.iconbtn,.chip,.card,.qt,#nav button,.pk,.ck,.cgrid button,.wb,.seg button,.ri,#pm button,.gpb,.tb-app,.rcard,.fab,#lsc button,.vq,.wg-qs button';
  let cur=null;
  (()=>{const R=document.documentElement;
  const split=s=>{const o=[];let d=0,c='';for(const ch of s){if(ch==='('||ch==='[')d++;if(ch===')'||ch===']')d--;if(ch===','&&!d){o.push(c);c=''}else c+=ch}o.push(c);return o};
  const fix=P=>{const L=P.cssRules;for(let i=L.length-1;i>=0;i--){const r=L[i];
    if(typeof r.selectorText==='string'){if(r.selectorText.includes(':hover')){try{const sel=split(r.selectorText).map(p=>p.includes(':hover')?':where(html:not(.tch)) '+p.trim():p.trim()).join(',');P.insertRule(sel+'{'+r.style.cssText+'}',i);P.deleteRule(i+1)}catch(e){}}}
    else if(r.cssRules&&r.cssRules.length&&r.type!==7)fix(r)}};
  try{for(const s of document.styleSheets){try{fix(s)}catch(e){}}}catch(e){}
  try{if(matchMedia('(hover:none)').matches)R.classList.add('tch')}catch(e){}
  document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')R.classList.add('tch')},{passive:true,capture:true});
  document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')R.classList.remove('tch')},{passive:true,capture:true})})();
  const osEl=document.getElementById('os');let tt=0;
  document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;clearTimeout(tt);osEl.classList.add('touching')},{passive:true,capture:true});
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(tt);tt=setTimeout(()=>osEl.classList.remove('touching'),260)},{passive:true,capture:true}));
  const rel=()=>{if(!cur)return;const el=cur;cur=null;const w=Math.max(0,45-(performance.now()-el._pt));setTimeout(()=>{el.classList.remove('pr');el.classList.add('prr');setTimeout(()=>el.classList.remove('prr'),450)},w)};
  document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest(SEL);if(!t||t.disabled||t.classList.contains('widget')||t.closest('.edit,#kb,#lock.lked-on'))return;if(cur)rel();cur=t;t._pt=performance.now();t.classList.add('pr')},{passive:true,capture:true});
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,rel,{passive:true,capture:true}));
  document.addEventListener('scroll',()=>{if(cur){const el=cur;cur=null;el.classList.remove('pr')}},{passive:true,capture:true});
})();
</script>
