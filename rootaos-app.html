<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Root AOs</title>
<style>
:root{--h:270;
  --bg:hsl(var(--h) 24% 8%);--s1:hsl(var(--h) 20% 12%);--s2:hsl(var(--h) 18% 16%);--s3:hsl(var(--h) 16% 21%);
  --tx:hsl(var(--h) 30% 94%);--tx2:hsl(var(--h) 14% 68%);--line:hsl(var(--h) 16% 25%);
  --ac:hsl(var(--h) 92% 74%);--onac:hsl(var(--h) 60% 12%);--ac2:hsl(calc(var(--h) + 150) 80% 68%);
  --ok:#5be3a2;--err:#ff6b7a;--warn:#ffc063;--code:#0a0912;color-scheme:dark}
[data-theme=light]{--bg:hsl(var(--h) 45% 97%);--s1:#fff;--s2:hsl(var(--h) 45% 94%);--s3:hsl(var(--h) 35% 89%);
  --tx:hsl(var(--h) 40% 12%);--tx2:hsl(var(--h) 14% 40%);--line:hsl(var(--h) 22% 84%);
  --ac:hsl(var(--h) 72% 48%);--onac:#fff;--ac2:hsl(calc(var(--h) + 150) 70% 36%);--ok:#12975f;--err:#d33a4c;--warn:#b86e00;--code:#f0eefc;color-scheme:light}
/* --nb: запас снизу под плавающие кнопки навигации Android */
:root{--nb:0px}   /* отступ под кнопки навигации теперь задаёт сама система (iframe заканчивается над ними) */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- splash ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;
  background:radial-gradient(520px 320px at 50% 22%,color-mix(in oklab,var(--ac) 22%,transparent),transparent 70%)}
.sp-ring{position:relative;width:104px;height:104px}
.sp-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sp-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.sp-ring .bg{stroke:var(--s3)}.sp-ring .fg{stroke:var(--ac);stroke-dasharray:289;stroke-dashoffset:289}
.sp-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.ic{display:inline-grid;place-items:center;line-height:0}.ic svg{width:1em;height:1em}
.splash h1{font-size:28px;letter-spacing:-.01em}
.splash .sub{color:var(--tx2);font-size:13px;margin-top:-10px}
.chk{width:min(360px,100%);text-align:left;font:12.5px/1.9 ui-monospace,Menlo,Consolas,monospace;color:var(--tx2);min-height:96px}
.chk div{opacity:0;transform:translateY(4px);transition:.25s}.chk div.on{opacity:1;transform:none}
.chk .ok{color:var(--ok)}.chk .bad{color:var(--err)}.chk .wr{color:var(--warn)}
.sp-bar{width:min(360px,100%);height:5px;border-radius:3px;background:var(--s3);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}

/* ---------- common ---------- */
.btn{appearance:none;border:0;cursor:pointer;padding:12px 18px;border-radius:999px;background:var(--ac);color:var(--onac);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.07)}
.btn.t{background:var(--s3);color:var(--tx)}.btn.d{background:var(--err);color:#fff}.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--s3);color:var(--tx2);white-space:nowrap}
.chip.ok{background:color-mix(in oklab,var(--ok) 18%,var(--s2));color:var(--ok)}
.chip.bad{background:color-mix(in oklab,var(--err) 18%,var(--s2));color:var(--err)}
.chip.wr{background:color-mix(in oklab,var(--warn) 18%,var(--s2));color:var(--warn)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card+.card{margin-top:10px}
.card h3{font-size:15px;margin-bottom:4px}.card p{color:var(--tx2);font-size:13.5px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin:18px 4px 8px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;min-height:56px}
.row.click{cursor:pointer}.row.click:active{background:var(--s2)}
.row .e{flex:none;width:38px;height:38px;border-radius:12px;background:var(--s3);display:grid;place-items:center;font-size:20px}
.row .tt{flex:1;min-width:0}.row .tt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt small{display:block;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{position:relative;flex:none;width:46px;height:28px;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--s3);transition:.2s}
.sw i:after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--tx2);transition:.2s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:22px;background:var(--onac)}
input[type=text],input[type=search],input[type=number],textarea,select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:90px}
input[type=range]{width:100%;accent-color:var(--ac);height:30px}
input[type=color]{width:46px;height:38px;border:0;background:none;padding:0}
label.f{display:block;font-size:12.5px;color:var(--tx2);margin:12px 2px 6px;font-weight:600}
.seg{display:flex;gap:4px;background:var(--s2);padding:4px;border-radius:999px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ac);color:var(--onac)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--tx2)}.kv span:nth-child(even){text-align:right;font-weight:600;word-break:break-word}
.empty{text-align:center;color:var(--tx2);padding:28px 10px;font-size:14px}
.snack{position:absolute;left:50%;bottom:calc(86px + var(--nb));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:13.5px;z-index:50;max-width:88%;text-align:center;box-shadow:0 8px 30px #0006;animation:sn .25s}
@keyframes sn{from{opacity:0;transform:translate(-50%,10px)}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{width:min(560px,100%);background:var(--s1);border-radius:26px 26px 0 0;padding:20px 18px calc(18px + var(--nb) + env(safe-area-inset-bottom));animation:up .25s;max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:18px;margin-bottom:8px}.sheet p{color:var(--tx2);margin-bottom:6px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer;font-size:14px}.ck input{margin-top:3px;accent-color:var(--ac);width:18px;height:18px}

/* ---------- gate ---------- */
.gate{flex:1;overflow:auto;padding:26px 20px calc(26px + var(--nb) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.gate .big{width:112px;height:112px;border-radius:36px;display:grid;place-items:center;font-size:54px;background:var(--s2);border:1px solid var(--line)}
.gate .big.bad{background:color-mix(in oklab,var(--err) 16%,var(--s2))}.gate .big.wr{background:color-mix(in oklab,var(--warn) 16%,var(--s2))}
.gate h2{font-size:24px}
@media (max-height:820px){.gate{padding-top:18px;gap:10px}.gate .big{width:76px;height:76px;border-radius:26px;font-size:38px}.gate h2{font-size:21px}}.gate p{color:var(--tx2);max-width:420px}
.list{width:min(420px,100%);text-align:left;display:grid;gap:8px;margin-top:6px}
.list .ln{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px}
.list .ln i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}

/* ---------- main ---------- */
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.hd .ttl{font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;display:flex;align-items:baseline;gap:8px}.hd .ttl small{font-size:12px;color:var(--tx2);font-weight:600}
.bd{flex:1;min-height:0;overflow:auto;padding:12px 14px calc(18px + var(--nb))}
.tabs{flex:none;display:flex;gap:6px;padding:8px 10px calc(8px + var(--nb) + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.tabs button{flex:1;border:0;background:transparent;border-radius:16px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--tx2);cursor:pointer}
.tabs button i{font-style:normal;font-size:20px}.tabs button.on{background:var(--s3);color:var(--tx)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--s1);border-radius:20px;padding:13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .12s,background .12s}
.tile:active{transform:scale(.97);background:var(--s2)}
.tile i{font-style:normal;font-size:22px;width:40px;height:40px;border-radius:13px;background:var(--s3);display:grid;place-items:center}
.tile b{font-size:14px;line-height:1.2}.tile small{font-size:12px;color:var(--tx2);line-height:1.3}
.cats{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--s1);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer}
.cats button.on{background:var(--ac);color:var(--onac);border-color:transparent}
.pg{display:flex;flex-direction:column;height:100%}
.pg .ph{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pg .ph button{width:40px;height:40px;border-radius:50%;border:0;background:var(--s3);font-size:18px;cursor:pointer}
.pg .ph b{font-size:17px}.pg .ph small{display:block;color:var(--tx2);font-size:12px}
.pg .pb{flex:1;min-height:0;overflow:auto;padding:12px 14px 22px}

/* ---------- terminal / logs ---------- */
.term{background:var(--code);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;height:48vh;min-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--ac)}.term .e{color:var(--err)}.term .d{color:var(--tx2)}
.tin{display:flex;gap:8px;margin-top:8px}.tin input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 10px;font:12px ui-monospace,Menlo,monospace;color:var(--tx2);cursor:pointer}
.lg{font:11.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
.lg div{white-space:pre-wrap;word-break:break-word}
.lg .I{color:var(--tx)}.lg .W{color:var(--warn)}.lg .E{color:var(--err)}.lg .t{color:var(--tx2)}
.meter{height:12px;border-radius:6px;background:var(--s3);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .5s}
table.ps{width:100%;border-collapse:collapse;font-size:12.5px}
table.ps th{color:var(--tx2);text-align:left;font-weight:600;padding:4px 6px}table.ps td{padding:7px 6px;border-top:1px solid var(--line)}
table.ps td:last-child{text-align:right}
.big-n{font-size:40px;font-weight:800;letter-spacing:-.02em}
.prev{height:96px;border-radius:18px;border:1px solid var(--line);margin:8px 0}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.icg button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--s2);font-size:22px;cursor:pointer}
.icg button.on{border-color:var(--ac);background:var(--s3)}
.tones{display:flex;gap:10px}.tones button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}.tones button.on{border-color:var(--tx)}
.ed{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:240px;white-space:pre;tab-size:2;background:var(--code)}
iframe.pv{width:100%;height:340px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:10px}
code.i{font:12.5px ui-monospace,Menlo,monospace;background:var(--s3);padding:1px 6px;border-radius:6px}
pre.cd{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--code);border:1px solid var(--line);border-radius:14px;padding:10px 12px;overflow:auto;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,a,...kids){
  const el=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='style')el.style.cssText=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected')el[k]=v;
    else el.setAttribute(k,v===true?'':v)}
  const add=x=>{if(x==null||x===false)return;if(Array.isArray(x))x.forEach(add);else el.append(x.nodeType?x:document.createTextNode(String(x)))};
  kids.forEach(add);return el}
const app=$('#app');
const view=el=>app.replaceChildren(el);
/* ---------- иконки (SVG вместо эмодзи) ---------- */
const IP={
 lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',

 plane:'<path d="M2 16l9-3V6a1.5 1.5 0 0 1 3 0v7l8 3v2l-8-2v4l2 2v1l-3.5-1L8 22v-1l2-2v-4l-8 2z"/>',

 tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5L3 17.6V21h3.4l6.3-6.3a4 4 0 0 0 5-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
 refresh:'<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12A9 9 0 0 1 18.5 5.8L21 8M21 3v5h-5M3 21v-5h5"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 snow:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/>',

 stopwatch:['Секундомер',HEAD+'#t{font:700 56px ui-monospace,monospace;margin:36px 0}\n</style>\n<div id="t">00:00.0</div>\n<button id="b" onclick="tog()">Старт</button><button onclick="rs()">Сброс</button>\n<script>\nvar run=0,t0=0,acc=0,iv;\nfunction f(ms){var s=ms/1000,m=Math.floor(s/60);return (m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60).toFixed(1)}\nfunction draw(){document.getElementById("t").textContent=f(acc+(run?Date.now()-t0:0))}\nfunction tog(){if(run){acc+=Date.now()-t0;run=0;clearInterval(iv)}else{t0=Date.now();run=1;iv=setInterval(draw,100)}document.getElementById("b").textContent=run?"Стоп":"Старт";draw()}\nfunction rs(){run=0;acc=0;clearInterval(iv);document.getElementById("b").textContent="Старт";draw()}\n<\/script>\n'],
 tip:['Чаевые',HEAD+'.r{font-size:34px;font-weight:800;margin:18px 0}\n</style>\n<h2>Калькулятор чаевых</h2>\n<input id="a" type="number" placeholder="Сумма счёта" oninput="c()">\n<p>Чаевые: <b id="p">10</b>%</p>\n<input id="s" type="range" min="0" max="30" value="10" oninput="document.getElementById(\'p\').textContent=this.value;c()">\n<div class="r" id="r">0</div>\n<script>\nfunction c(){var a=+document.getElementById("a").value||0,p=+document.getElementById("s").value;document.getElementById("r").textContent=(a*(1+p/100)).toFixed(2)}\n<\/script>\n'],
 root:['Root: акцент',HEAD+'</style>\n<h2>Цвет акцента системы</h2>\n<p id="m">Проверяю root…</p>\n<input id="s" type="range" min="0" max="360" value="270" style="padding:0">\n<h1 id="h">270°</h1>\n<button onclick="uname()">uname -a</button>\n<pre id="o" style="text-align:left;white-space:pre-wrap;font-size:12px"></pre>\n<script>\nalfa.root.available().then(function(ok){document.getElementById("m").textContent=ok?"Root доступен ✓":"Root недоступен"});\nvar s=document.getElementById("s");\ns.addEventListener("input",function(){document.getElementById("h").textContent=s.value+"°"});\ns.addEventListener("change",function(){alfa.root.exec("settings put hue "+s.value)});\nfunction uname(){alfa.root.exec("uname -a").then(function(r){document.getElementById("o").textContent=r.o})}\n<\/script>\n'],
 clicker:['Кликер',HEAD+'#b{font-size:64px;width:180px;height:180px;border-radius:50%;margin:30px 0}\n</style>\n<h2>Очки: <span id="p">0</span></h2>\n<button id="b" onclick="hit()">Тап</button>\n<p style="opacity:.6">Рекорд: <span id="r">0</span></p>\n<script>\nvar p=0,r=0;\nalfa.store.get("rec").then(function(v){r=+v||0;document.getElementById("r").textContent=r});\nfunction hit(){p++;document.getElementById("p").textContent=p;alfa.vibrate(8);if(p>r){r=p;document.getElementById("r").textContent=r;alfa.store.set("rec",r)}}\n<\/script>\n']};
const ED={id:null,name:'Моё приложение',icon:'rocket_launch',tone:'p',code:TPL.hello[1],mode:'edit',pv:false};
const TONES={p:'hsl(var(--h) 80% 70%)',s:'hsl(calc(var(--h) + 40) 70% 66%)',t:'hsl(calc(var(--h) + 90) 70% 64%)'};
let pvWin=null;
addEventListener('message',e=>{const d=e.data;if(!d||!d.ualfa||!pvWin||e.source!==pvWin)return;
  P('uapi','__studio',d.m,d.a).then(r=>pvWin&&pvWin.postMessage({ualfa:1,id:d.id,ok:true,res:r},'*')).catch(er=>pvWin&&pvWin.postMessage({ualfa:1,id:d.id,ok:false,err:er.message},'*'))});

STUDIO.open=function(body){
  const wrap=h('div');body.append(wrap);
  const draw=()=>{wrap.replaceChildren(seg([['edit','Редактор'],['mine','Мои приложения'],['doc','Справка']],ED.mode,k=>{ED.mode=k;pvWin=null;draw()}),h('div',{style:'height:12px'}));
    const box=h('div');wrap.append(box);
    if(ED.mode==='edit')editor(box);else if(ED.mode==='mine')mine(box);else docs(box)};
  const editor=box=>{
    const name=h('input',{type:'text',maxlength:24,value:ED.name,placeholder:'Название приложения'});name.addEventListener('input',()=>ED.name=name.value);
    const ig=h('div',{class:'icg'}),tg=h('div',{class:'tones'});
    const drI=()=>ig.replaceChildren(...ICONS.map(([e,m])=>h('button',{type:'button',class:m===ED.icon?'on':'',title:m,onclick:()=>{ED.icon=m;drI()}},e)));
    const drT=()=>tg.replaceChildren(...['p','s','t'].map(k=>h('button',{type:'button',class:k===ED.tone?'on':'','aria-label':'Цвет '+k,style:'background:'+TONES[k],onclick:()=>{ED.tone=k;drT()}})));drI();drT();
    const ta=h('textarea',{class:'ed',spellcheck:'false',autocapitalize:'off',value:ED.code});
    const cnt=h('small',{style:'color:var(--tx2)'});const upc=()=>{cnt.textContent=ta.value.split('\n').length+' строк · '+ta.value.length+' символов'};upc();
    ta.addEventListener('input',()=>{ED.code=ta.value;upc()});
    ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');ED.code=ta.value;upc()}});
    const tsel=h('select',{},...Object.keys(TPL).map(k=>h('option',{value:k},TPL[k][0])));
    const pvBox=h('div');
    const run=async()=>{const html=await T(()=>P('uwrap',ta.value));if(html==null)return;const f=h('iframe',{class:'pv',sandbox:'allow-scripts allow-forms allow-modals',title:'Предпросмотр'});f.srcdoc=html;pvBox.replaceChildren(f);pvWin=f.contentWindow;
      f.addEventListener('load',()=>{pvWin=f.contentWindow})};
    const save=async()=>{if(!ED.name.trim()){toast('Введите название');return}if(!ta.value.trim()){toast('Код пустой');return}
      const r=await T(()=>P('uappSave',{id:ED.id,name:ED.name.trim(),icon:ED.icon,tone:ED.tone,code:ta.value}));
      if(r){ED.id=r.id;toast(r.created?'Приложение установлено — ищите на рабочем столе':'Изменения сохранены');draw()}};
    box.append(ED.id?h('div',{class:'card',style:'display:flex;align-items:center;gap:10px'},h('div',{style:'flex:1'},h('b',{},'Редактирование'),h('small',{style:'display:block;color:var(--tx2)'},ED.id)),btn('Новое','t sm',()=>{Object.assign(ED,{id:null,name:'Моё приложение',icon:'rocket_launch',tone:'p',code:TPL.hello[1]});draw()})):null,
      h('label',{class:'f'},'Название'),name,h('label',{class:'f'},'Иконка'),ig,h('label',{class:'f'},'Цвет иконки'),tg,
      h('label',{class:'f'},'Шаблон'),h('div',{style:'display:flex;gap:8px'},tsel,btn('Загрузить','t',()=>{ED.code=TPL[tsel.value][1];ta.value=ED.code;upc();toast('Шаблон загружен')})),
      h('label',{class:'f'},'Код приложения (HTML + CSS + JS)'),ta,h('div',{style:'margin-top:4px'},cnt),
      h('div',{class:'btns'},btn('▶ Запустить','t',run),btn(ED.id?'Сохранить изменения':'Собрать и установить','',save)),pvBox)};
  const mine=async box=>{
    const L=await T(()=>P('uapps'))||[];
    if(!L.length){box.append(h('div',{class:'empty'},'Своих приложений пока нет. Создайте первое в редакторе.'));return}
    box.append(...L.map(a=>h('div',{class:'card'},h('div',{style:'display:flex;gap:12px;align-items:center'},h('div',{class:'e',style:'width:44px;height:44px;border-radius:14px;background:'+TONES[a.tone]+';display:grid;place-items:center;font-size:22px'},ico(emojiOf(a.icon))),h('div',{style:'flex:1;min-width:0'},h('b',{},a.name),h('small',{style:'display:block;color:var(--tx2)'},a.id+' · '+a.size)),chip(a.root?'root ✓':'без root',a.root?'ok':'')),
      h('div',{class:'btns',style:'margin-top:10px'},btn('Открыть','sm',()=>T(()=>P('uappOpen',a.id))),btn('Править','t sm',async()=>{const r=await T(()=>P('uappGet',a.id));if(r){Object.assign(ED,{id:a.id,name:r.name,icon:r.icon,tone:r.tone,code:r.code,mode:'edit'});draw()}}),btn('Удалить','d sm',async()=>{const ok=await dlg({title:'Удалить «'+a.name+'»?',text:'Приложение и его данные будут удалены.',ok:'Удалить',danger:true});if(ok){await T(()=>P('uappRemove',a.id));if(ED.id===a.id)ED.id=null;draw()}})))))};
  const docs=box=>{
    const D=(t,d,code)=>h('div',{class:'card'},h('h3',{},t),h('p',{},d),code?h('pre',{class:'cd'},code):null);
    box.append(D('Как это работает','Приложение — это один HTML-документ. Он запускается в изолированном окне, а к системе обращается через объект alfa. Нажмите «Собрать и установить» — иконка появится на рабочем столе.'),
      D('alfa.toast(text, icon?)','Короткое сообщение внизу экрана.','alfa.toast("Готово","check")'),
      D('alfa.notify(title, text)','Уведомление в шторке.','alfa.notify("Таймер","Время вышло")'),
      D('alfa.vibrate(ms)','Вибрация.','alfa.vibrate(30)'),
      D('alfa.title(text) · alfa.close()','Заголовок окна и закрытие приложения.','alfa.title("Мои заметки")'),
      D('alfa.theme()','Promise с текущей темой системы: {hue, dark}.','alfa.theme().then(function(t){document.body.style.background="hsl("+t.hue+" 30% 12%)"})'),
      D('alfa.store.get / set / del','Постоянное хранилище приложения. Работает через Promise.','alfa.store.set("score",10);\nalfa.store.get("score").then(console.log)'),
      D('alfa.root.available() · alfa.root.exec(cmd)','Выполнение команд терминала с правами root. При первом вызове система спросит разрешение, а выдать или отозвать его можно в «Root-менеджере».','alfa.root.exec("settings put hue 120")\n  .then(function(r){console.log(r.o)})'),
      D('Идеи','Таймер, заметки, мини-игра, виджет с погодой через fetch, панель быстрых root-команд.'))};
  draw()};

/* ================= старт ================= */
P('theme').then(applyTheme).catch(()=>{}).then(splash);
})();
