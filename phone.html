/* ---------- шторка ---------- */
#shade{inset:0;z-index:6}

/* ---------- недавние ---------- */

/* ---------- блокировка и загрузка ---------- */
#lock{inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;padding:84px max(28px,env(safe-area-inset-left)) 40px;touch-action:none;cursor:pointer}
#lock{background:var(--surface)}
#shade.onlock{z-index:9}

/* ===== v19: анимация разблокировки «Свечение» и плеер на экране блокировки ===== */
@keyframes ubw{0%{filter:brightness(2.1) saturate(1.4) blur(12px);scale:1.12}42%{filter:brightness(1.4) saturate(1.2) blur(4px)}100%{filter:none;scale:1}}
@keyframes ubi{0%{opacity:0;translate:0 46px;scale:.7;filter:blur(8px)}100%{opacity:1;translate:0 0;scale:1;filter:blur(0)}}
@keyframes ubf{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
#os.unl.ubl #wall{animation:ubw 1.15s cubic-bezier(.16,1,.3,1) backwards;will-change:transform,filter}
#os.unl.ubl #grid>*,#os.unl.ubl #dock>*{animation:ubi .85s cubic-bezier(.22,1,.3,1) backwards;animation-delay:var(--ud,0ms);will-change:transform,opacity}
.ubflash{position:absolute;inset:0;z-index:39;pointer-events:none;background:radial-gradient(130% 100% at var(--fx,50%) 100%,rgb(255 244 224/.95),rgb(255 226 190/.55) 46%,rgb(255 255 255/0) 78%);animation:ubf 1.1s ease-out both}
#os.lite .ubflash{display:none}
#os.lite.unl.ubl #wall{animation-name:uw2}
#lhint,#lsc,#lnotes{transition:opacity .4s ease,filter .5s ease}
#lmini{align-self:stretch;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:26px;color:#fff;cursor:pointer;background:color-mix(in oklab,hsl(var(--lmh,220) 55% 45%) 40%,rgb(18 18 28/.5));backdrop-filter:blur(calc(18px*var(--bl,1)));-webkit-backdrop-filter:blur(calc(18px*var(--bl,1)));transition:opacity .4s ease,filter .5s ease,transform .5s cubic-bezier(.22,1,.3,1)}
#lmini[hidden]{display:none}
#lmini:active{transform:scale(.97)}
#lmini .lmcv{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--lmh,220) 80% 62%),hsl(calc(var(--lmh,220) + 50) 75% 48%))}
#lmini .lt{flex:1;min-width:0;display:flex;flex-direction:column}
#lmini .lt b,#lmini .lt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lmini .lt small{opacity:.75}
#lmini .iconbtn{color:#fff}
#lmus{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding:150px 28px 60px;pointer-events:none;color:#fff;touch-action:none}
#lmus[hidden]{display:none}
#lock.lm-on #lmus{pointer-events:auto}
#lmus .lmbg{position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(120% 80% at 50% 30%,hsl(var(--lmh,220) 58% 46%),hsl(calc(var(--lmh,220) + 25) 52% 20%));clip-path:circle(0 at 50% var(--cy,70%));transition:opacity .45s ease,clip-path .8s cubic-bezier(.22,1,.3,1)}
#lock.lm-on #lmus .lmbg{opacity:1;clip-path:circle(150% at 50% var(--cy,70%))}
#lmus .lmart{width:min(68%,300px);aspect-ratio:1;border-radius:12%;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(135deg,hsl(var(--lmh,220) 85% 62%),hsl(calc(var(--lmh,220) + 60) 80% 48%));box-shadow:0 22px 60px hsl(var(--lmh,220) 60% 12%/.6);opacity:0;scale:.55;filter:blur(16px);transition:opacity .5s ease,scale .7s cubic-bezier(.22,1,.3,1),filter .6s ease}
#lmus .lmart .ms{font-size:96px}
#lmus .lmti,#lmus .lmct{opacity:0;translate:0 26px;filter:blur(8px);transition:opacity .45s ease,translate .6s cubic-bezier(.22,1,.3,1),filter .5s ease}
#lmus .lmti{text-align:center;display:flex;flex-direction:column;gap:2px;max-width:100%}
#lmus .lmti b{font:700 22px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lmus .lmti small{opacity:.75;font-size:15px}
#lmus .lmct{display:flex;align-items:center;gap:22px}
#lmus .lmct .iconbtn{color:#fff;width:54px;height:54px}
#lmus .lmpp{width:72px;height:72px;border:0;border-radius:50%;display:grid;place-items:center;background:#fff;color:hsl(var(--lmh,220) 55% 22%)}
#lmus .lmpp .ms{font-size:38px}
#lmus .lmx{position:absolute;top:58px;right:18px;color:#fff;opacity:0;transition:opacity .4s ease .2s}
#lock.lm-on #lmus .lmart{opacity:1;scale:1;filter:none;transition-delay:.1s}
#lock.lm-on #lmus .lmti{opacity:1;translate:0 0;filter:none;transition-delay:.22s}
#lock.lm-on #lmus .lmct{opacity:1;translate:0 0;filter:none;transition-delay:.3s}
#lock.lm-on #lmus .lmx{opacity:1}
#lock.lm-on .lbox{scale:.5;transform-origin:50% 0;margin-top:34px}
#lock.lm-on #lmini,#lock.lm-on #lhint,#lock.lm-on #lsc,#lock.lm-on #lnotes{opacity:0;filter:blur(12px);pointer-events:none}

/* --- v20: плавность, перемотка, эквалайзер --- */
:root{--lme:cubic-bezier(.32,.72,0,1)}
@property --lmh{syntax:'<number>';inherits:true;initial-value:220}
#lmini{position:relative;overflow:hidden;transition:opacity .5s ease,filter .6s ease,transform .6s var(--lme),--lmh .9s ease}
#lmini .lmpg{position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px;background:rgb(255 255 255/.75);transform-origin:0 0;transform:scaleX(0);transition:transform .3s linear}
#lmus{transition:--lmh .9s ease}
#lmus .lmbg{transition:opacity .6s ease,clip-path 1.05s var(--lme)}
#lmus .lmart{opacity:1;scale:1;filter:none;transition:scale .8s var(--lme),translate .8s var(--lme)}
#lock.lm-on #lmus .lmart{transition-delay:0s}
#lmus .lmti,#lmus .lmct,#lmus .lmsk{transition:opacity .6s ease,translate .9s var(--lme),filter .7s ease}
#lock.lm-on #lmus .lmti{transition-delay:.18s}
#lock.lm-on #lmus .lmsk{transition-delay:.26s}
#lock.lm-on #lmus .lmct{transition-delay:.34s}
#os #lock .lbox{transition:scale 1s var(--lme),translate 1s var(--lme),margin-top .6s var(--lme)}
#os #lock.lm-on .lbox{scale:.5;translate:0 34px;margin-top:0}
/* beta 0.3.1: часы на экране блокировки.
   - маленькие часы статус-бара скрыты, пока виден большой экран блокировки;
   - когда появляется мини-плеер, большие часы плавно уменьшаются;
   - когда плеер открыт, минуты поднимаются к часам, всё уменьшается и улетает в левый верхний угол,
     где переходит в маленькие часы статус-бара.
   Всё анимируется только через translate/scale/opacity (работает на GPU, без перерасчёта разметки). */
#lock .lbox{position:relative;z-index:3;transform-origin:50% 0;will-change:transform,opacity}
#os #lock .lbox{transition:scale 1s var(--lme),translate 1s var(--lme),margin-top .6s var(--lme),transform-origin 1s var(--lme),opacity .45s ease}
#os.lk #sclock{opacity:0;transition:opacity .4s ease}
#os.lk:has(#lock.lm-on) #sclock{opacity:1;transition:opacity .5s ease .5s}
#os #lock:has(#lmini:not([hidden])):not(.lm-on):not(.lked-on) .lbox{scale:.8}
#os #lock.lm-on .lbox{scale:.07;translate:-12px -54px;transform-origin:0 0;opacity:0;pointer-events:none;transition:scale 1s var(--lme),translate 1s var(--lme),transform-origin 1s var(--lme),opacity .5s ease .45s}
body.dev #os #lock.lm-on .lbox{translate:-12px -48px}
#lock #lclock[data-s=ios26] span{transition:translate .9s var(--lme)}
/* дата: мягко гаснет при открытии плеера и может стоять в разных местах */
#ldate{transition:opacity .35s ease,translate .5s var(--lme)}
#lock.lm-on #ldate{opacity:0;translate:0 -10px}
#lock[data-dp=above] .lbox{display:flex;flex-direction:column}
#lock[data-dp=above] #ldate{order:-1;margin:0 0 8px}
#lock>#ldate{position:absolute;z-index:3;left:max(28px,env(safe-area-inset-left));right:max(28px,env(safe-area-inset-left));margin:0;pointer-events:none}
#lock.center>#ldate{text-align:center}
#lock[data-dp=top]>#ldate{top:48px}
body.dev #lock[data-dp=top]>#ldate{top:40px}
#lock[data-dp=top] .lbox{padding-top:24px}
#lock[data-dp=bottom]>#ldate{bottom:120px}
#lock[data-dp=bottom]:has(#lmini:not([hidden]))>#ldate{bottom:196px}
#lock.lm-on #lclock[data-s=ios26] span+span{translate:calc(100% + .12em) -100%}
/* облегчение для телефонов (режим lite): без размытия и теней на больших слоях */
#os.lite #lock #lclock,#os.lite #lock #lclock span{filter:none}
#os.lite #lock.lm-on #lmini,#os.lite #lock.lm-on #lhint,#os.lite #lock.lm-on #lsc,#os.lite #lock.lm-on #lnotes{filter:none;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#os.lite #lmus .lmart,#os.lite #lmus .lmti,#os.lite #lmus .lmct,#os.lite #lmus .lmsk{filter:none!important}
#os.lite #lock.lm-on #lwall i{animation-play-state:paused!important}
#lmus{contain:layout style}
#lhint,#lsc,#lnotes{transition:opacity .55s ease,filter .7s ease}
#lmus .lmsk{width:100%;display:flex;flex-direction:column;gap:4px;opacity:0;translate:0 26px;filter:blur(8px)}
#lock.lm-on #lmus .lmsk{opacity:1;translate:0 0;filter:none}

.eqv{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:24px;background:var(--surf-2,rgb(127 127 127/.12))}

/* ===== v3 additions ===== */
#os{--bl:1;--glass:color-mix(in oklab,var(--surface) 74%,transparent)}
#os.nb{--glass:color-mix(in oklab,var(--surface) 95%,transparent)}
#os #dock,#os .menu,#os #toast,#os #vtoast,#os #kb,#os #shade .panel{background:var(--glass);backdrop-filter:blur(calc(24px*var(--bl)));-webkit-backdrop-filter:blur(calc(24px*var(--bl)))}
#os #shade .scrim{backdrop-filter:blur(calc(14px*var(--bl)));-webkit-backdrop-filter:blur(calc(14px*var(--bl)))}
#os #drawer{backdrop-filter:blur(calc(46px*var(--bl)));-webkit-backdrop-filter:blur(calc(46px*var(--bl)))}
#os #recents{backdrop-filter:blur(calc(32px*var(--bl)));-webkit-backdrop-filter:blur(calc(32px*var(--bl)))}
#os #pm{backdrop-filter:blur(calc(24px*var(--bl)));-webkit-backdrop-filter:blur(calc(24px*var(--bl)))}
#os.nb *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#os.perf *:not(i),#os.perf *::before,#os.perf *::after{box-shadow:none!important;text-shadow:none!important;filter:none!important}
#os.perf :not(.win):not(.win *){animation:none!important;transition:none!important}
/* планшет */
/* громкость */
#vtoast{transform:translate(-50%,-18px) scale(.9);transition:opacity .25s,transform .5s var(--spring)}
#vtoast.on{transform:translate(-50%,0) scale(1)}
#vtoast i b{transition:width .28s cubic-bezier(.2,.8,.2,1)}
/* экран блокировки */
#lock .lhint{align-self:center;gap:0;padding:8px 26px 12px;border-radius:28px;background:var(--glass);backdrop-filter:blur(calc(18px*var(--bl)));-webkit-backdrop-filter:blur(calc(18px*var(--bl)));box-shadow:0 0 0 1px color-mix(in oklab,var(--primary) 30%,transparent),0 8px 30px color-mix(in oklab,var(--primary) 25%,transparent);display:flex;flex-direction:column;align-items:center}
#lock .lhint .ms{animation:lbob 1.7s ease-in-out infinite;color:var(--primary)}
@keyframes lbob{50%{translate:0 -7px;opacity:.55}}
.urip{position:absolute;left:50%;bottom:-8%;width:70%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--primary) 75%,transparent),transparent);z-index:9;pointer-events:none}
#lock #lclock:not([data-s=norm])::before{display:none}
#lock #lclock[data-s=bold]{font-weight:800;letter-spacing:-.06em;padding:.06em .14em;margin:-.06em -.14em;background:linear-gradient(135deg,var(--primary),var(--tertiary,var(--primary)));-webkit-background-clip:text;background-clip:text;color:transparent}
#lock #lclock[data-s=outline]{font-weight:800;color:transparent;-webkit-text-stroke:3px var(--primary)}
#lock #lclock[data-s=words]{display:flex;flex-direction:column;gap:2px;letter-spacing:-.02em;font-size:0}
#lock #lclock[data-s=words] span{font:700 calc(clamp(40px,11vw,78px)*var(--lsz,1))/1.02 var(--display)}
#lock #lclock[data-s=words] span+span{color:var(--primary);opacity:.9}
body.dev #lock #lclock[data-s=words] span{font-size:calc(min(14cqw,54px)*var(--lsz,1))}
#lock #lclock[data-s=tiles]{display:flex;gap:8px;font-size:calc(var(--lsz,1)*clamp(44px,12vw,84px))}
#lock #lclock[data-s=tiles] b{width:1.18em;aspect-ratio:1;display:grid;place-items:center;border-radius:.34em;background:color-mix(in oklab,var(--primary) 24%,var(--surf-3));font-weight:700;letter-spacing:0}
#lock #lclock[data-s=tiles] b:nth-child(2){margin-right:.14em}
body.dev #lock #lclock[data-s=tiles]{font-size:calc(var(--lsz,1)*min(15cqw,60px))}
#lock #lclock[data-s=analog]{width:calc(var(--lsz,1)*min(240px,62vw));font-size:0;line-height:0}
#lock #lclock[data-s=analog] svg{width:100%;display:block}
.af{fill:color-mix(in oklab,var(--surf-3) 55%,transparent);stroke:currentColor;stroke-width:1.2}
.at{stroke:currentColor;stroke-width:1.4;opacity:.7}

/* видео */

.gvid{width:100%;height:100%;object-fit:contain}

/* ===== v11: разблокировка как в HyperOS (только transform/opacity — без filter, не лагает) ===== */
#os.unl #home{animation:none!important}
#os.unl #wall{animation:uw2 .95s cubic-bezier(.16,1,.3,1) backwards;will-change:transform}
@keyframes uw2{from{scale:1.2}}
#os.unl #grid>*,#os.unl #dock>*{animation:ui2 .58s cubic-bezier(.34,1.45,.64,1) backwards;animation-delay:var(--ud,0ms);will-change:transform,opacity}
@keyframes ui2{from{opacity:0;scale:.6;translate:var(--ux,0px) var(--uy,0px)}35%{opacity:1}}
#os.unl #dock,#os.unl #lock *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
/* подложка дока не должна висеть пустой «полоской», пока иконки ещё не появились при разблокировке */
#os.unl #dock{animation:dkb .45s ease-out .22s backwards}
@keyframes dkb{from{background:transparent;box-shadow:none}}
/* кнопки навигации / полоска жестов проявляются вместе с домашним экраном, а не выскакивают поверх уходящей блокировки */
#os.unl #nav,#os.unl #gbar{animation:navin .4s ease-out .3s backwards}
@keyframes navin{from{opacity:0;translate:0 12px}}
/* «полоски для листания» при разблокировке — это полосы прокрутки сетки: иконки при анимации на миг вылезают за край. Прячем их */
#grid,#dock{scrollbar-width:none}#grid::-webkit-scrollbar,#dock::-webkit-scrollbar{display:none}
#os.unl #grid,#os.unl #dock{overflow:hidden!important}
#os.unl #pgd{animation:navin .4s ease-out .3s backwards}
.uflash{position:absolute;inset:0;z-index:39;pointer-events:none;background:radial-gradient(circle at var(--fx,50%) var(--fy,100%),rgb(255 255 255/.5),rgb(255 255 255/0) 62%);animation:ufl .62s ease-out both}
@keyframes ufl{0%{opacity:0}22%{opacity:1}100%{opacity:0}}

/* ===== v11: стили часов экрана блокировки на AOD ===== */
#aodc .aclk.stk{display:flex;flex-direction:column;align-items:center;font:700 clamp(84px,27vw,150px)/.82 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
#aodc .aclk.stk,#aodc .aclk.bold,#aodc .aclk.tiles{font-family:var(--lff,ui-rounded,'SF Pro Rounded',var(--display));font-weight:var(--lwt,700)}
#aodc .aclk.ios26{line-height:.8;padding:.06em .14em;margin:-.06em -.14em;background:linear-gradient(180deg,color-mix(in oklab,var(--lcol,#fff) 96%,transparent),color-mix(in oklab,var(--lcol,#fff) 42%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
#aodc .aclk.bold{font-weight:800;letter-spacing:-.06em}
#aodc .aclk.tiles{display:flex;gap:7px;font:700 clamp(40px,12vw,76px)/1 var(--display)}
#aodc .aclk.tiles b{width:1.18em;aspect-ratio:1;display:grid;place-items:center;border-radius:.34em;background:rgb(255 255 255/.14);font-weight:700}
#aodc .aclk.tiles b:nth-child(2){margin-right:.14em}

/* ===== v10: набор номера помещается в экран ===== */
.ph .seg{flex-wrap:nowrap;align-self:stretch;max-width:100%}
.ph .seg button{flex:1 1 0;min-width:0;padding:9px 6px;font-size:14px;white-space:nowrap}

/* ===== v12: recovery touch ===== */
#rcv{z-index:99;pointer-events:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#rcv .ri{min-height:58px;transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .12s}

/* ===== v12: мгновенный отклик нажатия (не ждём :active) ===== */

.tile.pr{scale:1!important}.tile.pr .ai{scale:.86;transition:scale .07s ease-out}

.tile.prr .ai{transition:scale .42s cubic-bezier(.34,1.8,.5,1)}
/* ===== v12: ещё лёгкая разблокировка ===== */
#os.lk #grid>*,#os.lk #dock>*,#os.lk #wall,#os.lk #lock{will-change:transform,opacity}
#os.unl .wall i,#os.unl #lock i{animation-play-state:paused!important}
#os.unl #wall{animation-duration:.8s}
#os.unl #grid>*,#os.unl #dock>*{animation-duration:.5s}
.uflash{will-change:opacity;animation-duration:.5s}

/* ===== v13: иконки скрыты под замком, мягкий вход ===== */
#os.lk #home{visibility:hidden;opacity:0}
#os.unl #home>*:not(#grid):not(#dock){animation:ufade .4s ease-out .12s backwards}
@keyframes ufade{from{opacity:0}}
#os.lite .uflash{display:none}
#os.lite.unl #wall{animation-duration:.6s}
#os.idlewall .wall i{animation-play-state:paused!important}

.slots{position:absolute;z-index:0;pointer-events:none}

#os.dg .tile .rm,#os.dg .tile .rs{display:none!important}
.tile.ghost:not(.widget){opacity:0}
.tile.fly{scale:1.14;will-change:translate,scale}

/* ===== v15: отклик, цвет корпуса, выдвижная камера ===== */
html,body{overscroll-behavior:none}
button,.li,.srow,.nitem,.card,.sw{touch-action:manipulation;-webkit-touch-callout:none}
.prr{transition:scale .34s cubic-bezier(.34,1.8,.5,1),opacity .2s!important}

  .tile:hover .ai svg,.tile:focus-visible .ai svg{transform:none}

  .card:hover{border-radius:24px}.fab:hover{border-radius:22px}.gt:hover{border-radius:18px}
  .rcard:hover{transform:none}
}
@media (pointer:coarse){
  .bt-x,.bt-new,.vq{position:relative}
  .bt-x::after,.bt-new::after,.vq::after{content:'';position:absolute;inset:-9px}
}

.stbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 4px}.stbar i{display:block}.wl small .ms{font-size:14px;vertical-align:-3px}
#popm{position:absolute;left:10px;right:10px;bottom:0;height:32px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bd1) 86%,#777),var(--bd1));box-shadow:inset 0 1px 0 rgb(255 255 255/.16),inset 0 0 0 1px rgb(0 0 0/.25);
  transform:translateY(104%);transition:transform calc(var(--popd,460ms)*.7) cubic-bezier(.5,0,.8,.3)}

  transform:translateY(-115%);transition:transform calc(var(--popd,460ms)*.7) cubic-bezier(.5,0,.8,.3)}

/* ===== v18: камера — раскладка без перекрытий, видимая выдвижная камера ===== */
.cam2{display:flex;flex-direction:column;background:#000}
.cam2 .cstage{position:relative;inset:auto;order:2;flex:1;min-height:0;width:100%}
.cam2 .ctop{position:relative;order:1;flex:none;flex-direction:row;flex-wrap:nowrap;justify-content:safe center;align-items:center;gap:6px;padding:10px 10px 8px;background:#000;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.cam2 .ctop::-webkit-scrollbar{display:none}
.cam2 .ctop .cb{flex:none}
.cam2 .cbot{position:relative;order:3;flex:none;padding:8px 14px 14px;background:#000}
.cam2 .cpanel{position:absolute;left:0;right:0;bottom:100%;z-index:5;padding:10px 12px;background:rgb(0 0 0/.74);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cam2 .cpanel[hidden]{display:none}
.cam2 .cset{max-height:min(300px,45vh)}
.cam2 .rtag{top:72px;z-index:5}
body.dev[data-cam=pop] #dev{box-sizing:border-box;padding-top:50px}
body.dev[data-cam=pop] #bezel{height:min(calc(94dvh - 2*var(--bt,7px) - 50px),calc((100vw - 28px)*var(--arh,2.167)))}
#popw{width:116px;margin-left:-58px;height:46px;top:calc(-48px - var(--bt,7px));z-index:30}
#popm{height:42px;left:6px;right:6px;border-radius:16px 16px 0 0;background:linear-gradient(180deg,#5a5a66,#26262c 55%,#0e0e12);box-shadow:inset 0 1px 0 rgb(255 255 255/.32),inset 0 0 0 1px rgb(255 255 255/.1),0 -2px 12px rgb(0 0 0/.5)}
#popw .pml,#popin .pml{width:22px;height:22px}
#popin{z-index:99999}
.cam2 .cpx{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:rgb(255 255 255/.24);color:#fff;display:grid;place-items:center;position:sticky;z-index:3;margin-left:auto}
.cam2 .cset .cpx{top:0;right:0;align-self:flex-end;margin:0 0 2px auto}
.cam2 .cpanel:not(.cset) .cpx{right:0}
.cam2 .zed{border-radius:50%!important;background:rgb(0 0 0/.42)!important;color:#fff!important;display:grid;place-items:center}
.cam2 .znum{width:84px;height:36px;border:0;border-radius:12px;padding:0 10px;background:rgb(255 255 255/.2);color:#fff;font:600 14px var(--body,inherit);text-align:center}
/* форм-факторы */




body.ff-fold{--wc:.633;--wo:1.266}
body.ff-foldu{--wc:.44;--wo:.88}
/* Fold: закрытый корпус = размер режима «Телефон» (правило body.dev #bezel); раскрытый = две такие половины, потом масштаб под экран */
body.dev.ff-fold #dev,body.dev.ff-foldu #dev{grid-template-columns:minmax(0,1fr);overflow:hidden}
body.dev.ff-fold.ffo #bezel,body.dev.ff-foldu.ffo #bezel,body.dev.ff-fold #bezel.fa,body.dev.ff-foldu #bezel.fa{aspect-ratio:calc(2/var(--arh));max-width:none}
body.dev.ff-flip #bezel{--H0:min(calc(96dvh - 2*var(--bt,7px)),calc((100vw - 20px)*2.33));aspect-ratio:auto;height:calc(var(--H0)*.5);width:calc(var(--H0)*.43)}
body.dev.ff-flip.ffo #bezel,body.dev.ff-flip #bezel.fa{height:var(--H0)}
/* ===== v18: раскрытие только на transform/opacity (GPU), без reflow и без наследуемых переменных ===== */
#os.fa *{backdrop-filter:none!important;animation-play-state:paused!important}
#bezel.fa #os,#bezel.fa #fx,#bezel.fa #cvr{will-change:transform,opacity}
#fbase{display:none;position:absolute;inset:0;border-radius:var(--br,46px);background:linear-gradient(135deg,#101016,#050507);box-shadow:0 0 0 var(--bt,7px) var(--bd1),0 0 0 calc(var(--bt,7px) + 2px) var(--bd2)}
body.dev.ff-fold #bezel.fa #fbase,body.dev.ff-foldu #bezel.fa #fbase{display:block;left:50%}
body.dev.ff-flip #bezel.fa #fbase{display:block;top:50%}
/* Fold: закрытый корпус = правая половина, петля слева; створка-«дверь» на петле, раскрытие влево */
body.dev.ff-fold #bezel.fa #os,body.dev.ff-foldu #bezel.fa #os,body.dev.ff-fold #bezel.fa #fx,body.dev.ff-foldu #bezel.fa #fx{inset:0 0 0 auto;width:50%;transform-origin:0 50%}
/* Flip: закрытый корпус = нижняя половина, крышка на петле сверху, раскрытие вверх */
body.dev.ff-flip #bezel.fa #fx,body.dev.ff-flip #bezel.fa #cvr{top:auto;height:50%}
body.dev.ff-flip #bezel.fa #fx{transform-origin:50% 100%}
body.dev.ff-flip #bezel.fa #os{transform-origin:50% 100%}
body.dev.ff-flip #bezel.fa #cvr{transform-origin:50% 0}
#fx .fflap,#fx .fflaph{display:none;position:absolute;opacity:0;pointer-events:none}
body.ff-fold #fx .fflap,body.ff-foldu #fx .fflap{display:block;top:0;bottom:0;left:0;width:50%;background:linear-gradient(90deg,rgb(0 0 0/.5),rgb(0 0 0/.12));box-shadow:inset 2px 0 0 rgb(255 255 255/.14)}
body.ff-flip #fx .fflaph{display:block;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgb(0 0 0/.5),rgb(0 0 0/.12));box-shadow:inset 0 2px 0 rgb(255 255 255/.14)}
/* ручка на свободном краю: тянем пальцем, чтобы раскрыть/сложить */
#fgrab{display:none;position:absolute;z-index:9;touch-action:none;cursor:grab;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
body.dev.ffx #fgrab{display:flex}
#fgrab>i{display:block;border-radius:3px;background:rgb(255 255 255/.55);box-shadow:0 0 0 1px rgb(0 0 0/.3)}
body.ff-fold #fgrab,body.ff-foldu #fgrab{top:10%;bottom:10%;width:30px;right:0}
body.ff-fold.ffo #fgrab,body.ff-foldu.ffo #fgrab{right:auto;left:0}
body.ff-fold #fgrab>i,body.ff-foldu #fgrab>i{width:4px;height:48px}
body.ff-flip #fgrab{left:15%;right:15%;height:30px;bottom:0}
body.ff-flip.ffo #fgrab{bottom:auto;top:0}
body.ff-flip #fgrab>i{height:4px;width:48px}
#bezel.fa #fgrab>i,#bezel.fa #fgrab .fh{opacity:0}
#fgrab .fh{display:none;position:absolute;white-space:nowrap;font:600 12px var(--body);color:#fff;background:rgb(0 0 0/.62);padding:6px 10px;border-radius:12px;pointer-events:none;animation:fgh 1.5s ease-in-out infinite}
body.fhint #fgrab .fh{display:block}
body.ff-fold #fgrab .fh,body.ff-foldu #fgrab .fh{right:34px}
body.ff-fold.ffo #fgrab .fh,body.ff-foldu.ffo #fgrab .fh{right:auto;left:34px}
body.ff-flip #fgrab .fh{bottom:34px}
body.ff-flip.ffo #fgrab .fh{bottom:auto;top:34px}
@keyframes fgh{0%,100%{transform:translate(0,0)}50%{transform:translate(-7px,0)}}
body.ff-flip #fgrab .fh{animation-name:fgv}
@keyframes fgv{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-7px)}}
body.dev.ff-flip.ffo #cvr:not(.fa){display:none}
#foldbtn{position:fixed;top:12px;right:12px;z-index:60;height:42px;padding:0 16px 0 12px;border:0;border-radius:21px;align-items:center;gap:8px;background:var(--surf-3);color:var(--on-surface);font:600 14px var(--body);cursor:pointer;box-shadow:var(--shadow);transition:background .25s,scale .15s}
body.dev.ffx #foldbtn{display:flex}
#foldbtn:hover{background:var(--primary-c);color:var(--on-primary-c)}#foldbtn:active{scale:.94}
/* внешний экран флипа */
#cvr{position:absolute;inset:0;border-radius:var(--br,46px);overflow:hidden;z-index:7;color:#fff;font-family:var(--display);container-type:size;pointer-events:none;
  background:radial-gradient(120% 80% at 85% 8%,color-mix(in oklab,var(--primary) 40%,#000),#000 72%);user-select:none}
body.dev.ff-flip #cvr{display:block}
body.dev.ff-flip:not(.ffo) #cvr{pointer-events:auto}
#cvr .cv-lens{position:absolute;left:6cqw;width:11cqw;height:11cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6f7cff 0 8%,#1a1f4a 30%,#050509 70%);box-shadow:0 0 0 .9cqw #15151b,inset 0 0 0 .6cqw #000}
#cvr .cv-lens.a{top:6cqw}#cvr .cv-lens.b{top:21cqw}
#cvr .cv-fl{position:absolute;left:21cqw;top:12.5cqw;width:3.2cqw;height:3.2cqw;border-radius:50%;background:#efe9c9}
#cvr .cv-p{position:absolute;left:7cqw;right:7cqw;top:38cqw;transition:opacity .35s,translate .45s cubic-bezier(.2,0,0,1)}
#cvr .cv-t{font-size:25cqw;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#cvr .cv-d{margin-top:2.5cqw;font-size:5.2cqw;opacity:.75}
#cvr .cv-r{display:flex;gap:2.5cqw;margin-top:5cqw;flex-wrap:wrap}
#cvr .cv-c{display:inline-flex;align-items:center;gap:1.6cqw;padding:2cqw 3.6cqw;border-radius:6cqw;background:rgb(255 255 255/.12);font-size:4.4cqw;font-weight:600}
#cvr .cv-c .ms{font-size:5.6cqw}
#cvr .cv-g{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
#cvr .cv-b{height:18cqw;border:0;border-radius:6cqw;background:rgb(255 255 255/.12);color:#fff;display:grid;place-items:center;transition:background .25s,color .25s,border-radius .35s var(--spring),scale .15s}
#cvr .cv-b .ms{font-size:8cqw}#cvr .cv-b:active{scale:.94}
#cvr .cv-b[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-radius:9cqw}
#cvr .cv-p2{opacity:0;translate:0 3cqw;pointer-events:none}
/* ===== внешний экран Flip: страница приложений + мини-приложения ===== */
#cvr .cv-lens,#cvr .cv-fl{z-index:9}
#cvr .cv-p3{opacity:0;translate:0 3cqw;pointer-events:none}
#cvr.p3 .cv-p3{opacity:1;translate:0 0;pointer-events:auto}
#cvr .cv-ag{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
#cvr .cv-at{height:26cqw;border:0;border-radius:6cqw;background:rgb(255 255 255/.12);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;font:600 4cqw var(--body);transition:background .2s,scale .15s}
#cvr .cv-at .ms{font-size:9cqw}#cvr .cv-at:active{scale:.94;background:rgb(255 255 255/.2)}
#cvr .cv-dots{position:absolute;right:3cqw;top:5cqw;display:flex;gap:1cqw;z-index:7}
#cvr .cv-dots i{width:7cqw;height:7cqw;position:relative;cursor:pointer}
#cvr .cv-dots i::after{content:'';position:absolute;left:2.6cqw;top:2.6cqw;width:1.8cqw;height:1.8cqw;border-radius:50%;background:rgb(255 255 255/.28)}
#cvr:not(.p2):not(.p3) .cv-dots i:nth-child(1)::after,#cvr.p2 .cv-dots i:nth-child(2)::after,#cvr.p3 .cv-dots i:nth-child(3)::after{background:#fff}
#cvr .cv-app{position:absolute;inset:0;z-index:8;background:#000;display:none;flex-direction:column;border-radius:inherit}
#cvr .cv-app.on{display:flex}
#cvr .cv-ah{display:flex;align-items:center;justify-content:space-between;margin:6cqw 6cqw 0 26cqw;height:10cqw;font:700 5cqw var(--display)}
#cvr .cv-x{width:10cqw;height:10cqw;border:0;border-radius:50%;background:rgb(255 255 255/.14);color:#fff;display:grid;place-items:center}
#cvr .cv-x .ms{font-size:6cqw}#cvr .cv-x:active{scale:.9}
body:has(#cvr.ao) #fgrab{pointer-events:none}
body:has(#cvr.ao) #fgrab .fh{display:none!important}
#cvr .cv-ab{position:absolute;left:6cqw;right:6cqw;top:34cqw;bottom:9cqw;display:flex;flex-direction:column;gap:2cqw;min-height:0}
#cvr .cv-cd{height:12cqw;display:flex;align-items:flex-end;justify-content:flex-end;font:600 9cqw/1 var(--display);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
#cvr .cv-ky{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.6cqw;min-height:0}
#cvr .cv-k{border:0;border-radius:4cqw;background:rgb(255 255 255/.12);color:#fff;font:600 5cqw var(--body);padding:0}
#cvr .cv-k.o{background:var(--primary);color:var(--on-primary)}#cvr .cv-k.f{background:rgb(255 255 255/.22)}#cvr .cv-k:active{scale:.93}
#cvr .cv-seg{display:flex;gap:1.6cqw;height:9cqw}
#cvr .cv-seg button,#cvr .cv-ch{flex:1;border:0;border-radius:5cqw;background:rgb(255 255 255/.12);color:#fff;font:600 3.8cqw var(--body);padding:0}
#cvr .cv-seg button[aria-pressed=true],#cvr .cv-ch.on{background:var(--primary);color:var(--on-primary)}
#cvr .cv-tm{flex:1;display:grid;place-items:center;font:700 17cqw/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#cvr .cv-tm small{font-size:8cqw;opacity:.6}
#cvr .cv-row{display:flex;gap:1.6cqw;height:10cqw}
#cvr .cv-big{height:13cqw;border:0;border-radius:7cqw;background:var(--primary);color:var(--on-primary);font:700 5cqw var(--body);flex:2}
#cvr .cv-big.s{background:rgb(255 255 255/.16);color:#fff;flex:1}
#cvr .cv-pm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2cqw;text-align:center}
#cvr .cv-pm .ms{font-size:16cqw;margin:0 auto;opacity:.9}
#cvr .cv-pt{font:700 6cqw var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cvr .cv-pa{font:500 4cqw var(--body);opacity:.65}
#cvr .cv-pr{height:2cqw;border-radius:1cqw;background:rgb(255 255 255/.18);overflow:hidden}
#cvr .cv-pr i{display:block;height:100%;width:0;background:#fff}
#cvr .cv-pc{display:flex;justify-content:center;align-items:center;gap:6cqw;height:16cqw}
#cvr .cv-pc button{border:0;border-radius:50%;width:12cqw;height:12cqw;background:rgb(255 255 255/.14);color:#fff;display:grid;place-items:center;padding:0}
#cvr .cv-pc button.m{width:16cqw;height:16cqw;background:var(--primary);color:var(--on-primary)}
#cvr .cv-pc .ms{font-size:7cqw}#cvr .cv-pc .m .ms{font-size:9cqw}#cvr .cv-pc button:active{scale:.92}
#cvr .cv-fb{flex:1;display:grid;place-items:center;align-content:center;gap:2cqw;border:0;background:none;color:#fff;font:600 4.6cqw var(--body)}
#cvr .cv-fb .cv-fc{width:34cqw;height:34cqw;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.12);transition:background .25s,color .25s,box-shadow .25s}
#cvr .cv-fb .ms{font-size:16cqw}
#cvr .cv-fb.on .cv-fc{background:#fff3b0;color:#222;box-shadow:0 0 12cqw #ffe27a88}
#cvr.p2 .cv-p1,#cvr.p3 .cv-p1{opacity:0;translate:0 -3cqw;pointer-events:none}
#cvr.p3 .cv-p2{opacity:0;pointer-events:none}
#cvr.p2 .cv-p2{opacity:1;translate:0 0;pointer-events:auto}
#cvr .cv-o{position:absolute;left:50%;bottom:5cqw;translate:-50% 0;display:inline-flex;align-items:center;gap:2cqw;height:11cqw;padding:0 6cqw 0 4cqw;border:0;border-radius:6cqw;background:rgb(255 255 255/.16);color:#fff;font:600 4.4cqw var(--body);transition:background .25s,scale .15s}
#cvr .cv-o .ms{font-size:6cqw}#cvr .cv-o:active{scale:.94}

/* ===== v21: экран блокировки — без перекрытий, лёгкая разблокировка, уведомления ===== */
#lmini{flex:none;margin-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#lock:has(#lmini:not([hidden])) #lfp{bottom:196px}
#os.lk #grid>*,#os.lk #dock>*{will-change:auto}
@keyframes ubw{0%{scale:1.12}100%{scale:1}}
@keyframes ubi{0%{opacity:0;translate:0 46px;scale:.7}100%{opacity:1;translate:0 0;scale:1}}
#os.lk #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
.lni{cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative}
.lni .lnt{align-self:flex-start;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.lni .lt small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lnclr{align-self:flex-start;margin-top:8px;flex:none}
#lock.center #lnclr{align-self:center}
#lnclr[hidden]{display:none}

/* v22: без полос прокрутки в шторке, шапка не вылезает за край */
#shade .panel{overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#shade .panel::-webkit-scrollbar{width:0;height:0;display:none}
#shade .sh-top{flex-wrap:wrap;gap:8px;min-width:0}
#shade .sh-top>div{min-width:0}
#shade .sh-top>div:last-child{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}

/* v23: плеер — без сплющивания, список всех треков; размытие мини-плеера на экране блокировки */
.mctl{gap:8px;width:100%;flex-wrap:nowrap}
.mctl .iconbtn{flex:0 1 44px;min-width:30px;width:auto;height:auto;aspect-ratio:1;border-radius:50%}
.mctl .mpp{flex:0 1 88px;min-width:54px;width:auto;height:auto;aspect-ratio:88/68;border-radius:34px}
.mctl .mpp.pl{border-radius:50%;aspect-ratio:1;flex-basis:68px}
.mctl .ms{flex:none}
.mcover{flex:none}
.page .mlist-h{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 2px;font:600 15px var(--display);color:var(--on-surface-v)}
.page .group .li{flex:none}
.mnp{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#os.nb #lmini{backdrop-filter:blur(20px) saturate(1.2)!important;-webkit-backdrop-filter:blur(20px) saturate(1.2)!important;background:color-mix(in oklab,hsl(var(--lmh,220) 55% 38%) 55%,rgb(18 18 28/.62))}
#os.nb #lock .lni{backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important}

/* v24: главный экран плеера */
.mroot{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.mroot>.page{flex:1;min-height:0}
.mhome{gap:14px!important;padding-bottom:16px}
.msearch{display:flex;align-items:center;gap:10px}
.msearch>.ms{flex:none;font-size:26px;color:var(--on-surface-v)}
.msb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:24px;background:var(--surf-2);color:var(--on-surface-v)}

.msb input::-webkit-search-cancel-button{display:none}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.mcard.pl{background:linear-gradient(135deg,#2f6a80,#223e52)}
.mcard.recent{background:linear-gradient(135deg,#7f8a3a,#2f7a8a)}
.mcard .ms{font-size:24px}.mcard b{font-size:14px;font-weight:600;white-space:nowrap}
.mcard:active{transform:scale(.96)}
.mcard[aria-pressed=true]{outline-color:#fff}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;height:38px;padding:0 18px;border:0;border-radius:19px;background:transparent;color:var(--on-surface-v);font-weight:600;font-size:15px;transition:background .25s,color .25s}
.mtab[aria-pressed=true]{background:var(--on-surface);color:var(--surface)}
.mshuf{display:flex;align-items:center;gap:10px}
.mshuf b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mshuf .sp{flex:1}
.mshp{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--on-surface);color:var(--surface);display:grid;place-items:center}
.mshp .ms{font-size:26px}
.mshuf .iconbtn{flex:none;background:transparent}
.mlist{display:flex;flex-direction:column;gap:2px}
.mlist>*{flex:none}
.mrow{display:flex;align-items:center;gap:14px;padding:8px 4px;border-radius:16px;min-height:64px;cursor:pointer;transition:background .2s}
.mrow:active{background:var(--surf-1)}

   3) устойчивое слияние: чем сильнее кадр отличается от опорного, тем меньше его вес (нет «призраков»)
   4) шумодав по шуму сцены (яркость + цвет)
   5) локальный тон-маппинг: синтетические экспозиции → слияние по пирамиде Лапласа → карта усиления с направляющим фильтром

/* Бегун (горизонтальная) */
function runnerApp(a){
  const W=640,H=360,G=290,sh=landShell(a,W,H),cv=sh.cv,ctx=cv.getContext('2d'),col=mkCol(a.el);
  let pb=G,pv=0,obs=[],spd=6,dist=0,state='idle',last=performance.now(),nextO=300,best=store.get('runner',0);
  const clouds=Array.from({length:4},(_,i)=>({x:i*180+rand(80),y:30+rand(90),s:.3+Math.random()*.4}));
  const sc=h('b',{},'0'),bs=h('b',{},String(best));
  sh.bar.prepend(h('div',{class:'score'},h('div',{},'Счёт',sc),h('div',{},'Рекорд',bs)));
  const ov=gOverlay('Бегун',(sh.rot()?'Экран повёрнут — держите телефон горизонтально. ':'')+'Тап по экрану — прыжок. Перепрыгивайте кактусы',start);
  const jump=()=>{if(state==='run'&&pb>=G-.5)pv=-13};
  sh.area.append(h('div',{class:'lctl r'},gpb('keyboard_arrow_up',jump)),ov);
  sh.area.addEventListener('pointerdown',e=>{if(e.target.closest('.sov'))return;jump()});
  function start(){pb=G;pv=0;obs=[];spd=6;dist=0;nextO=300;sc.textContent='0';state='run';last=performance.now();ov.hidden=true}
  function over(){state='over';const s=dist/10|0;if(s>best){best=s;store.set('runner',best);bs.textContent=best}ov.set('Врезались!','Счёт: '+s);ov.hidden=false}
  function step(){const now=performance.now(),dt=Math.min(2.5,(now-last)/16.67);last=now;
    clouds.forEach(c=>{c.x-=c.s*dt*(state==='run'?spd/3:.4);if(c.x<-60){c.x=W+rand(100);c.y=30+rand(90)}});
    if(state==='run'&&a.active()){pv+=.7*dt;pb+=pv*dt;if(pb>=G){pb=G;pv=0}
      spd=Math.min(13,6+dist/1200);dist+=spd*dt;sc.textContent=dist/10|0;
      nextO-=spd*dt;if(nextO<=0){const bird=dist>2500&&Math.random()<.35;obs.push(bird?{x:W+20,w:40,h:22,b:G-58,bird:1}:{x:W+20,w:16+rand(16),h:30+rand(34),b:G});nextO=380+rand(280)+spd*16}
      obs.forEach(o=>o.x-=spd*dt);obs=obs.filter(o=>o.x>-60);
      for(const o of obs){if(o.x+3<92&&o.x+o.w-3>68&&pb-3>o.b-o.h&&pb-38<o.b-3){over();break}}}
    draw()}
  function draw(){ctx.fillStyle=col('--surf-1');ctx.fillRect(0,0,W,H);ctx.fillStyle=col('--surf-3');clouds.forEach(c=>{ctx.beginPath();ctx.roundRect(c.x,c.y,60,16,8);ctx.fill()});
    ctx.fillStyle=col('--surf-3');ctx.fillRect(0,G,W,H-G);ctx.fillStyle=col('--outline');ctx.fillRect(0,G,W,2);
    obs.forEach(o=>{ctx.fillStyle=o.bird?'#e5484d':col('--tertiary');ctx.beginPath();ctx.roundRect(o.x,o.b-o.h,o.w,o.h,o.bird?11:5);ctx.fill()});
    ctx.fillStyle=col('--primary');ctx.beginPath();ctx.roundRect(68,pb-40,26,40,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(84,pb-32,6,6)}
  a.every(step,16);
  return{key(e){if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w'){if(state==='run')jump();else start();return true}return false}};
}

const wcIO=(m,f)=>wcDB().then(db=>new Promise((res,rej)=>{const t=db.transaction('img',m),q=f(t.objectStore('img'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
async function wcReg(c,blob){const bmp=await createImageBitmap(blob),i=100+c.id;
  SWX.add(i,(ctx,w,h)=>{const r=Math.max(w/bmp.width,h/bmp.height),dw=bmp.width*r,dh=bmp.height*r;ctx.drawImage(bmp,(w-dw)/2,(h-dh)/2,dw,dh)});
  if(window.SWN)window.SWN[i]=c.n;return i}
async function wcInit(){const m=store.get('cwp',[]);for(const c of m){try{const b=await wcIO('readonly',s=>s.get(c.id));if(b)await wcReg(c,b)}catch(e){}}if(m.length&&window.SW)SW.sync()}
setTimeout(wcInit,0);
function wcThumb(i){if(i<3||!window.SWX)return null;const cv=document.createElement('canvas');cv.width=120;cv.height=250;cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';SWX.draw(i,cv);return cv}
function wcAuto(i){if(i>=8&&i<100&&(!LC.cs||LC.cs==='norm')){LC.cs=({8:'slim',9:'giant',10:'poster',11:'giant',12:'slim',13:'slim',14:'giant',15:'poster',16:'slim',17:'giant',18:'poster',19:'slim',20:'poster',21:'giant'})[i]||'slim';LC.tall=false}}
function wallTiles(cur,pick){const nm=i=>(window.SWN||[])[i]||'Обои',t=[0,1,2];if(cur>=3)t.push(cur);
  return [...t.map(i=>h('button',{class:'wp p'+i,'aria-pressed':cur===i,onclick:()=>pick(i)},h('i',{class:'a'}),h('i',{class:'b'}),wcThumb(i),h('span',{},nm(i)))),
    h('button',{class:'wp wmore',onclick:()=>wallCatalog(pick)},ic('apps'),h('span',{},'Больше обоев'))]}
function wallCatalog(pick){if($('#wcat'))return;const nm=i=>(window.SWN||[])[i]||'Обои',meta=store.get('cwp',[]),q=[];
  const kd=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}};
  const close=()=>{document.removeEventListener('keydown',kd,true);q.length=0;o.animate([{opacity:1},{opacity:0}],{duration:160}).onfinish=()=>o.remove()};
  const cur=S.wall,card=(i,mine)=>{const b=h('button',{class:'wcc'+(cur===i?' on':''),onclick:()=>{close();pick(i)}});
    if(i<3){b.classList.add('wp','p'+i);b.append(h('i',{class:'a'}),h('i',{class:'b'}))}else{const cv=document.createElement('canvas');cv.width=140;cv.height=290;b.append(cv);q.push(()=>SWX.draw(i,cv))}
    b.append(h('span',{},nm(i)));
    if(mine)b.append(h('i',{class:'wcx',role:'button','aria-label':'Удалить',onclick:e=>{e.stopPropagation();wcDel(i,()=>{close();setTimeout(()=>wallCatalog(pick),200)})}},ic('close')));return b};
  const inp=h('input',{type:'file',accept:'image/*',style:'display:none',onchange:async()=>{const f=inp.files&&inp.files[0];if(!f)return;
    try{const bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88)),id=store.get('cwpn',0)+1,c={id,n:'Моё фото '+id};await wcIO('readwrite',s=>s.put(blob,id));store.set('cwpn',id);store.set('cwp',[...store.get('cwp',[]),c]);
      const i=await wcReg(c,blob);toast('Обои добавлены','wallpaper');close();pick(i)}catch(e){toast('Не удалось загрузить картинку','error')}}});
  const up=h('button',{class:'wcc wcu',onclick:()=>inp.click()},ic('add_photo_alternate'),h('b',{},'Загрузить своё'),inp);
  const sec=(t,list,mine)=>[h('h4',{},t),h('div',{class:'wcg'},...list.map(i=>card(i,mine)))];
  const rg=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
  const o=h('div',{id:'wcat'},h('div',{class:'wch'},h('button',{class:'wcback','aria-label':'Назад',onclick:close},ic('arrow_back')),h('b',{},'Обои')),
    h('div',{class:'wcb'},h('h4',{},'Мои'),h('div',{class:'wcg'},up,...meta.map(c=>card(100+c.id,true))),...sec('Системные',[0,1,2]),...sec('Живые',rg(3,7)),...sec('С эффектом глубины',rg(8,21)),...sec('Анимированные',rg(22,28))));
  document.addEventListener('keydown',kd,true);os.append(o);o.animate([{opacity:0,scale:.96},{opacity:1,scale:1}],{duration:260,easing:spring});
  const step=()=>{const f=q.shift();if(!f)return;try{f()}catch(e){}setTimeout(step,24)};setTimeout(step,260)}
async function wcDel(i,done){const id=i-100;try{await wcIO('readwrite',s=>s.delete(id))}catch(e){}
  store.set('cwp',store.get('cwp',[]).filter(c=>c.id!==id));SWX.del(i);if(window.SWN)delete window.SWN[i];
  if(S.wall===i){S.wall=0;store.set('wall',0)}if(LC.wall===i)LC.wall=-1;if(AOD.wi===i)AOD.wi=-1;store.set('lock',LC);store.set('aod',AOD);
  themeFx(()=>{applyTheme();try{aodWallSync()}catch(e){}});toast('Обои удалены','delete');if(done)done()}

})();

/* мгновенный отклик нажатия */
(()=>{const SEL='.tile,.li,.btn,.iconbtn,.chip,.card,.qt,#nav button,.pk,.ck,.cgrid button,.wb,.seg button,.ri,#pm button,.gpb,.tb-app,.rcard,.fab,#lsc button,.vq,.wg-qs button,.lni,#lnclr';
  let cur=null;
  (()=>{const R=document.documentElement;
  const split=s=>{const o=[];let d=0,c='';for(const ch of s){if(ch==='('||ch==='[')d++;if(ch===')'||ch===']')d--;if(ch===','&&!d){o.push(c);c=''}else c+=ch}o.push(c);return o};
  const fix=P=>{const L=P.cssRules;for(let i=L.length-1;i>=0;i--){const r=L[i];
    if(typeof r.selectorText==='string'){if(r.selectorText.includes(':hover')){try{const sel=split(r.selectorText).map(p=>p.includes(':hover')?':where(html:not(.tch)) '+p.trim():p.trim()).join(',');P.insertRule(sel+'{'+r.style.cssText+'}',i);P.deleteRule(i+1)}catch(e){}}}
    else if(r.cssRules&&r.cssRules.length&&r.type!==7)fix(r)}};
  try{for(const s of document.styleSheets){try{fix(s)}catch(e){}}}catch(e){}
  try{if(matchMedia('(hover:none)').matches)R.classList.add('tch')}catch(e){}
  document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')R.classList.add('tch')},{passive:true,capture:true});
  document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')R.classList.remove('tch')},{passive:true,capture:true})})();
  const osEl=document.getElementById('os');let tt=0;
  document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;clearTimeout(tt);osEl.classList.add('touching')},{passive:true,capture:true});
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(tt);tt=setTimeout(()=>osEl.classList.remove('touching'),260)},{passive:true,capture:true}));
  const rel=()=>{if(!cur)return;const el=cur;cur=null;const w=Math.max(0,45-(performance.now()-el._pt));setTimeout(()=>{el.classList.remove('pr');el.classList.add('prr');setTimeout(()=>el.classList.remove('prr'),450)},w)};
  document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest(SEL);if(!t||t.disabled||t.classList.contains('widget')||t.closest('.edit,#kb,#lock.lked-on'))return;if(cur)rel();cur=t;t._pt=performance.now();t.classList.add('pr')},{passive:true,capture:true});
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,rel,{passive:true,capture:true}));
  document.addEventListener('scroll',()=>{if(cur){const el=cur;cur=null;el.classList.remove('pr')}},{passive:true,capture:true});
})();


</script>
